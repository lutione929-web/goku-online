<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Phone OS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: linear-gradient(135deg, #1a0b2e, #090a15);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .home-screen {
      flex: 1; padding: 25px 15px; display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 15px; align-content: start; overflow-y: auto;
    }

    .app-icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .app-icon:active { transform: scale(0.9); }
    .icon-box {
      width: 55px; height: 55px; border-radius: 14px; display: flex; align-items: center;
      justify-content: center; font-size: 24px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 5px;
    }
    .app-name { font-size: 10px; color: #ddd; text-align: center; }

    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #121324; display: none; flex-direction: column; z-index: 50;
    }
    .app-window.active { display: flex; }

    .app-header {
      height: 40px; background: #1c1d36; display: flex; align-items: center;
      justify-content: space-between; padding: 0 12px; font-size: 13px; font-weight: bold;
      border-bottom: 1px solid #2a2b4a;
    }
    .back-btn { background: #2f3640; border: none; color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }

    .home-bar-area {
      height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); cursor: pointer;
    }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="phone-screen">
      
      <!-- الشاشة الرئيسية -->
      <div class="home-screen" id="homeScreen">
        <div class="app-icon" onclick="openApp('robloxApp')">
          <div class="icon-box" style="background:#222; border:2px solid #ff4757;">⬛</div>
          <span class="app-name">Roblox</span>
        </div>
        <div class="app-icon" onclick="openApp('whatsappApp')">
          <div class="icon-box" style="background:#25D366;">💬</div>
          <span class="app-name">WhatsApp</span>
        </div>
        <div class="app-icon" onclick="openApp('dangerApp')">
          <div class="icon-box" style="background:#8b0000; border:2px solid #ff0000;">⚠️</div>
          <span class="app-name">محمد الخطير</span>
        </div>
        <div class="app-icon" onclick="openApp('youtubeApp')">
          <div class="icon-box" style="background:#ff0000;">▶️</div>
          <span class="app-name">YouTube</span>
        </div>
      </div>

      <!-- 1. نافذة روبلوكس -->
      <div class="app-window" id="robloxApp">
        <div class="app-header">
          <button class="back-btn" onclick="goHome()">◀ رجوع</button>
          <span>Roblox Obby</span>
          <span></span>
        </div>
        <div style="padding:20px; text-align:center; color:#00f0ff;">
          <h3>لعبة روبلوكس تعمل بنجاح!</h3>
        </div>
      </div>

      <!-- 2. نافذة واتساب -->
      <div class="app-window" id="whatsappApp">
        <div class="app-header" style="background:#075e54;">
          <button class="back-btn" onclick="goHome()">◀ رجوع</button>
          <span>WhatsApp AI</span>
          <span></span>
        </div>
        <div style="flex:1; background:#0b141a; padding:10px; color:#fff; font-size:12px;">
          أهلاً بك في الواتساب الذكي!
        </div>
      </div>

      <!-- 3. نافذة محمد الخطير -->
      <div class="app-window" id="dangerApp">
        <div class="app-header" style="background:#300; border-bottom:2px solid #f00;">
          <button class="back-btn" onclick="goHome()" style="background:#500;">خروج</button>
          <span style="color:#ff4757;">محمد الخطير 💀</span>
          <span></span>
        </div>
        <div style="flex:1; background:#050000; padding:15px; color:#ff6b6b; font-size:13px; text-align:center;">
          <h2 style="color:#ff0000; margin-bottom:10px;">تحذير مرعب!</h2>
          <p>أنت الآن داخل التطبيق الخطير والمراقب بالكامل...</p>
        </div>
      </div>

      <!-- 4. نافذة يوتيوب -->
      <div class="app-window" id="youtubeApp">
        <div class="app-header" style="background:#990000;">
          <button class="back-btn" onclick="goHome()">◀ رجوع</button>
          <span>YouTube Gaming</span>
          <span></span>
        </div>
        <div style="padding:15px; text-align:center;">
          <iframe width="100%" height="160" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" frameborder="0" style="border-radius:8px"></iframe>
        </div>
      </div>

    </div>

    <!-- زر الهوم السفلي -->
    <div class="home-bar-area" onclick="goHome()">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    function openApp(id) {
      document.querySelectorAll('.app-window').forEach(w => w.classList.remove('active'));
      let target = document.getElementById(id);
      if(target) target.classList.add('active');
    }

    function goHome() {
      document.querySelectorAll('.app-window').forEach(w => w.classList.remove('active'));
    }
  </script>
</body>
</html>
