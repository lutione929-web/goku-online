<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Phone OS - Montagem Eclipse Phonk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.5); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: #07070b;
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; display: flex; flex-direction: column; z-index: 50; color: #fff; padding: 12px;
    }

    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 6px;
    }
    .app-title { font-size: 12px; font-weight: bold; background: linear-gradient(45deg, #ff0055, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* شبكة أزرار الفونك */
    .pad-grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 8px; margin-bottom: 8px;
    }

    .pad-btn {
      border-radius: 12px; border: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.05s, filter 0.05s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.95);
    }
    .pad-btn:active {
      transform: scale(0.9);
      filter: brightness(1.6);
      box-shadow: 0 0 25px currentColor;
    }

    .p-cowbell { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; }
    .p-808     { background: linear-gradient(135deg, #7700ff, #ff00aa); color: #ffccff; }
    .p-bass    { background: linear-gradient(135deg, #111122, #333355); color: #00ffcc; border: 1px solid #00ffcc; }
    .p-vocal   { background: linear-gradient(135deg, #00f0ff, #0044ff); color: #ccffff; }
    .p-synth   { background: linear-gradient(135deg, #ffea00, #ff5500); color: #ffff99; }
    .p-kick    { background: linear-gradient(135deg, #ff0000, #880000); color: #ff9999; }

    .control-panel {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .eclipse-btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer;
      background: linear-gradient(45deg, #ff0055, #7700ff); color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.5);
    }
    .eclipse-btn.active {
      background: linear-gradient(45deg, #00ffcc, #0088ff); color: #000;
    }

    .status-bar-dj {
      background: #141620; padding: 6px; border-radius: 8px; text-align: center; font-size: 10px; color: #ff0055; border: 1px solid #222; font-weight: bold;
    }

    #soundGate {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 7, 11, 0.96); z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }

    .home-bar-area { height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <div id="soundGate">
    <div style="font-size: 50px; margin-bottom: 10px;">🌑⚡</div>
    <h3 style="color: #ff0055; font-size: 16px; margin-bottom: 8px;">MONTAGEM ECLIPSE</h3>
    <p style="color: #aaa; font-size: 11px; margin-bottom: 20px;">اضغط لتفعيل استوديو الفونك البرازيلي الأسطوري!</p>
    <button onclick="unlockAudio()" style="background: linear-gradient(45deg, #ff0055, #7700ff); color: #fff; border: none; padding: 12px 25px; border-radius: 25px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 0 25px rgba(255,0,85,0.6);">دخول الاستوديو 🔥</button>
  </div>

  <div class="phone-body">
    <div class="phone-screen">
      
      <div class="app-window">
        <div class="app-header">
          <span class="app-title">🌑 MONTAGEM ECLIPSE (DJ FKU)</span>
          <span style="font-size: 10px; color: #00ffcc;" id="eclipseBadge">● OFF</span>
        </div>

        <div class="control-panel">
          <button class="eclipse-btn" id="eclipseToggleBtn" onclick="toggleEclipse()">▶ تشغيل إيقاع Eclipse تلقائياً</button>
        </div>

        <div class="pad-grid">
          <button class="pad-btn p-cowbell" onclick="playPhonk('cowbell1', 650, 'ECLIPSE BELL')">🔔 <span>ECLIPSE BELL</span></button>
          <button class="pad-btn p-cowbell" onclick="playPhonk('cowbell2', 480, 'DARK BELL')">🔔 <span>DARK BELL</span></button>
          <button class="pad-btn p-808"     onclick="playPhonk('phonk808', 110, 'SLIDING 808')">🎸 <span>808 SLIDE</span></button>
          
          <button class="pad-btn p-bass"    onclick="playPhonk('subbass', 55, 'SUB BASS')">🔊 <span>SUB BASS</span></button>
          <button class="pad-btn p-synth"   onclick="playPhonk('darklead', 350, 'ECLIPSE LEAD')">🎹 <span>LEAD MELODY</span></button>
          <button class="pad-btn p-kick"    onclick="playPhonk('hardkick', 95, 'HEAVY KICK')">🥁 <span>HEAVY KICK</span></button>
          
          <button class="pad-btn p-vocal"   onclick="playPhonk('vocalchop', 520, 'VOCAL CHOP')">🎤 <span>HEY! CHOP</span></button>
          <button class="pad-btn p-808"     onclick="playPhonk('cowbell_r', 800, 'RUSH BELL')">⚡ <span>RUSH BELL</span></button>
          <button class="pad-btn p-synth"   onclick="playPhonk('phonkfx', 950, 'DARK FX')">🌀 <span>CREEP FX</span></button>
          
          <button class="pad-btn p-bass"    onclick="playPhonk('distbass', 75, 'DISTORTED BASS')">🔥 <span>DIST BASS</span></button>
          <button class="pad-btn p-kick"    onclick="playPhonk('snare', 240, 'PHONK SNARE')">💥 <span>SNARE</span></button>
          <button class="pad-btn p-cowbell" onclick="playPhonk('cowbell_drop', 320, 'DROP BELL')">🔥 <span>DROP BELL</span></button>
        </div>

        <div class="status-bar-dj" id="djStatus">جاهز لتشغيل إيقاع Montagem Eclipse المظلم! 🎶</div>
      </div>

    </div>

    <div class="home-bar-area">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let eclipseInterval = null;
    let isEclipsePlaying = false;

    function unlockAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);

      document.getElementById('soundGate').style.display = 'none';
    }

    function toggleEclipse() {
      let btn = document.getElementById('eclipseToggleBtn');
      let badge = document.getElementById('eclipseBadge');

      if(!isEclipsePlaying) {
        isEclipsePlaying = true;
        btn.classList.add('active');
        btn.innerText = "⏹ إيقاف إيقاع Eclipse";
        badge.innerText = "● ECLIPSE ACTIVE";
        
        let step = 0;
        // ترتيب النغمات ليحاكي رتم الفونك البرازيلي السريع والمظلم لـ Montagem Eclipse
        let eclipsePattern = [
          () => playPhonk('hardkick', 95, 'ECLIPSE KICK'),
          () => playPhonk('cowbell1', 650, 'ECLIPSE BELL'),
          () => playPhonk('subbass', 55, 'ECLIPSE BASS'),
          () => playPhonk('cowbell2', 480, 'DARK BELL'),
          () => playPhonk('hardkick', 95, 'ECLIPSE KICK'),
          () => playPhonk('phonk808', 110, 'SLIDING 808'),
          () => playPhonk('vocalchop', 520, 'HEY CHOP'),
          () => playPhonk('cowbell1', 650, 'ECLIPSE BELL')
        ];

        eclipseInterval = setInterval(() => {
          eclipsePattern[step % eclipsePattern.length]();
          step++;
        }, 200); // سرعة إيقاع حماسية ومشتعلة

      } else {
        isEclipsePlaying = false;
        clearInterval(eclipseInterval);
        btn.classList.remove('active');
        btn.innerText = "▶ تشغيل إيقاع Eclipse تلقائياً";
        badge.innerText = "● OFF";
        document.getElementById('djStatus').innerText = "تم إيقاف إيقاع Eclipse!";
      }
    }

    function playPhonk(type, freq, name) {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();

      if(type.includes('cowbell')) {
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.75, now + 0.15);
        gain.gain.setValueAtTime(0.75, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      } else if(type.includes('808') || type.includes('bass')) {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq * 2.2, now);
        osc.frequency.exponentialRampToValueAtTime(freq, now + 0.3);
        gain.gain.setValueAtTime(0.95, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      } else if(type === 'hardkick') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      } else {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      }

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.35);

      document.getElementById('djStatus').innerText = `🌑 Eclipse: [ ${name} ]`;
    }
  </script>
</body>
</html>
