<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goku & Arcade Hub Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:5px;touch-action:none}
    
    .screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:340px;background:#1e272e;border:2px solid #ff7675;padding:20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
    .screen h2{color:#ff7675;margin-bottom:15px;font-size:1.2rem;text-align:center}
    input, select{width:100%;padding:10px;border-radius:8px;border:none;background:#2d3436;color:#fff;font-size:0.9rem;margin-bottom:10px;text-align:center}
    button{width:100%;background:#0984e3;color:#fff;border:none;padding:10px;border-radius:8px;font-size:0.9rem;cursor:pointer;font-weight:bold;margin-top:5px}
    .error-msg{color:#d63031;font-size:0.75rem;margin-top:5px}

    /* تنسيق لعبة غوكو */
    #gokuGameUI{display:none;flex-direction:column;align-items:center;width:100%}
    #gameCanvas{background:#1e272e;border:2px solid #ff7675;border-radius:10px}
    .joystick-area{width:320px;height:80px;background:#1e272e;border:2px dashed #ff7675;border-radius:10px;margin-top:5px;display:flex;align-items:center;justify-content:center;position:relative}
    .joystick-knob{width:40px;height:40px;background:#ff7675;border-radius:50%;position:absolute;cursor:pointer;display:flex;align-items:center;justify-content:center}

    /* تنسيق لعبة إكس أو وحجر ورق مقص */
    .arcade-game-container{display:none;flex-direction:column;align-items:center;background:#1e272e;padding:15px;border-radius:10px;border:2px solid #f1c40f;width:320px}
    .tictactoe-grid{display:grid;grid-template-columns:repeat(3, 70px);grid-template-rows:repeat(3, 70px);gap:5px;margin:15px 0}
    .t-cell{background:#2d3436;font-size:2rem;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:6px;color:#f1c40f;font-weight:bold}
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="screen" style="display:flex;">
    <h2>⚡ تسجيل الدخول للمنصة</h2>
    <input type="text" id="playerNameInput" placeholder="أدخل اسمك (إنجليزي)">
    <button onclick="goToLobby()">التالي</button>
    <span class="error-msg" id="loginError"></span>
  </div>

  <!-- شاشة اختيار اللعبة وغرفة الأكواد -->
  <div id="lobbyScreen" class="screen">
    <h2>🎮 اختر اللعبة وغرفتك</h2>
    <select id="gameSelect">
      <option value="goku">🔥 Goku Fighter Online</option>
      <option value="tictactoe">❌ إكس أو (Tic Tac Toe)</option>
      <option value="rps">✊ حجر ورق مقص</option>
    </select>
    <button onclick="createRoom()" style="background:#00b894;">إنشاء غرفة وتوليد كود 🔑</button>
    <hr style="width:100%; margin:15px 0; border-color:#444">
    <input type="text" id="roomCodeInput" placeholder="أدخل كود صديقك هنا">
    <button onclick="joinRoom()" style="background:#e17055;">انضمام لغرفة صديق 🚀</button>
    <span class="error-msg" id="lobbyError"></span>
  </div>

  <!-- شاشة انتظار اللاعب الثاني -->
  <div id="waitingScreen" class="screen">
    <h2>⏳ بانتظار انضمام صديقك...</h2>
    <p style="font-size:0.9rem; margin-bottom:15px;">أعطِ هذا الكود لصديقك:</p>
    <h1 id="displayRoomCode" style="color:#f1c40f; letter-spacing:3px; background:#2d3436; padding:10px; border-radius:6px">-----</h1>
  </div>

  <!-- واجهة لعبة غوكو -->
  <div id="gokuGameUI">
    <h1 style="font-size:1rem; color:#ff7675;">⚡ Goku Fighter Online</h1>
    <canvas id="gameCanvas" width="320" height="140"></canvas>
    <div style="display:flex; gap:5px; margin-top:5px">
      <button onclick="useKamehameha()" style="background:#d63031; padding:6px">💥 كامیهامیها</button>
    </div>
    <div class="joystick-area" id="joystickArea">
      <div class="joystick-knob" id="joystickKnob">🕹️</div>
    </div>
  </div>

  <!-- واجهة إكس أو (Tic Tac Toe) -->
  <div id="tictactoeUI" class="arcade-game-container">
    <h3 style="color:#f1c40f">❌ إكس أو أونلاين ⭕</h3>
    <p id="tTurnStatus" style="font-size:0.8rem; margin:5px 0">دور اللاعب: X</p>
    <div class="tictactoe-grid" id="tGrid">
      <div class="t-cell" onclick="makeTMove(0)"></div>
      <div class="t-cell" onclick="makeTMove(1)"></div>
      <div class="t-cell" onclick="makeTMove(2)"></div>
      <div class="t-cell" onclick="makeTMove(3)"></div>
      <div class="t-cell" onclick="makeTMove(4)"></div>
      <div class="t-cell" onclick="makeTMove(5)"></div>
      <div class="t-cell" onclick="makeTMove(6)"></div>
      <div class="t-cell" onclick="makeTMove(7)"></div>
      <div class="t-cell" onclick="makeTMove(8)"></div>
    </div>
  </div>

  <!-- واجهة حجر ورق مقص -->
  <div id="rpsUI" class="arcade-game-container">
    <h3 style="color:#0984e3">✊ حجر 📄 ورق ✂️ مقص</h3>
    <p id="rpsStatus" style="font-size:0.8rem; margin:10px 0">اختر حركتك:</p>
    <div style="display:flex; gap:10px">
      <button onclick="playRps('rock')">✊ حجر</button>
      <button onclick="playRps('paper')">📄 ورق</button>
      <button onclick="playRps('scissors')">✂️ مقص</button>
    </div>
  </div>

  <script>
    let socket = io();
    let myName = "", isDev = false, roomCode = "";
    let currentGame = "";

    function goToLobby() {
      const input = document.getElementById('playerNameInput');
      myName = input.value.trim();
      if(!/^[A-Za-z0-9_]{3,12}$/.test(myName)) {
        document.getElementById('loginError').innerText = "⚠️ اسم إنجليزي (3-12 حرف) مطلوب!";
        return;
      }
      isDev = (myName.toUpperCase() === 'EPIKDEV' || myName.toUpperCase() === 'MOHAMMED');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'flex';
    }

    function createRoom() {
      const gameType = document.getElementById('gameSelect').value;
      socket.emit('createRoom', { name: myName, isDev, gameType });
    }

    function joinRoom() {
      const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if(!code) {
        document.getElementById('lobbyError').innerText = "⚠️ أدخل الكود أولاً!";
        return;
      }
      roomCode = code;
      socket.emit('joinRoom', { roomCode: code, name: myName, isDev });
    }

    socket.on('roomCreated', (data) => {
      roomCode = data.roomCode;
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('waitingScreen').style.display = 'flex';
      document.getElementById('displayRoomCode').innerText = roomCode;
    });

    socket.on('errorMsg', (msg) => {
      document.getElementById('lobbyError').innerText = "⚠️ " + msg;
    });

    // بدء اللعبة لما يكتمل اللاعبين
    socket.on('startGame', (data) => {
      currentGame = data.gameType;
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('waitingScreen').style.display = 'none';

      if(currentGame === 'goku') {
        document.getElementById('gokuGameUI').style.display = 'flex';
        initGokuGame();
      } else if(currentGame === 'tictactoe') {
        document.getElementById('tictactoeUI').style.display = 'flex';
      } else if(currentGame === 'rps') {
        document.getElementById('rpsUI').style.display = 'flex';
      }
    });

    /* --- برمجة لعبة غوكو --- */
    let canvas, ctx, players = {}, myX = 140, myY = 60;
    function initGokuGame() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      
      socket.emit('playerJoin', { id: socket.id, name: myName, isDev, x: myX, y: myY });

      socket.on('currentPlayers', (serverPlayers) => { players = serverPlayers; drawGoku(); });
      socket.on('playerMove', (data) => { players[data.id] = data; drawGoku(); });
      socket.on('spawnBeam', () => { drawGoku(); });
      
      setInterval(() => {
        if(isDragging) {
          myX += moveVector.x * 4;
          myY += moveVector.y * 4;
          socket.emit('playerMove', { id: socket.id, x: myX, y: myY, name: myName, isDev });
          drawGoku();
        }
      }, 25);
    }

    let moveVector = {x:0, y:0}, isDragging = false;
    const area = document.getElementById('joystickArea');
    const knob = document.getElementById('joystickKnob');
    area.addEventListener('touchmove', handleJoystick);
    area.addEventListener('touchend', () => { knob.style.transform='translate(0,0)'; isDragging=false; });
    function handleJoystick(e) {
      e.preventDefault();
      let rect = area.getBoundingClientRect();
      let dx = (e.touches[0].clientX - (rect.left + rect.width/2));
      let dy = (e.touches[0].clientY - (rect.top + rect.height/2));
      let dist = Math.sqrt(dx*dx + dy*dy);
      if(dist > 30) { dx = (dx/dist)*30; dy = (dy/dist)*30; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveVector = {x: dx/30, y: dy/30};
      isDragging = true;
    }

    function useKamehameha() { socket.emit('kamehamehaAttack', { x: myX, y: myY }); }

    function drawGoku() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00b894'; ctx.fillRect(0, 100, canvas.width, 40);
      for(let id in players) {
        let p = players[id];
        ctx.fillStyle = p.isDev ? '#f1c40f' : '#ff7675';
        ctx.fillRect(p.x, p.y, 20, 25);
        ctx.fillStyle = '#fff'; ctx.font = '8px sans-serif'; ctx.textAlign='center';
        ctx.fillText(p.name, p.x + 10, p.y - 4);
      }
    }

    /* --- برمجة لعبة إكس أو --- */
    let tBoard = ['', '', '', '', '', '', '', '', ''];
    let mySymbol = 'X'; // سيتم تحديد الدور برمجياً
    function makeTMove(index) {
      if(tBoard[index] === '') {
        tBoard[index] = mySymbol;
        document.getElementsByClassName('t-cell')[index].innerText = mySymbol;
        socket.emit('makeMove', { index, symbol: mySymbol });
      }
    }
    socket.on('opponentMove', (data) => {
      tBoard[data.index] = data.symbol;
      document.getElementsByClassName('t-cell')[data.index].innerText = data.symbol;
    });

    /* --- برمجة حجر ورق مقص --- */
    function playRps(choice) {
      socket.emit('rpsPlay', { name: myName, choice });
      document.getElementById('rpsStatus').innerText = "⏳ تم إرسال اختيارك، بانتظار الخصم...";
    }
    socket.on('rpsResult', (data) => {
      document.getElementById('rpsStatus').innerText = `🎉 الخصم اختار: ${data.choice}`;
    });
  </script>
</body>
</html>
