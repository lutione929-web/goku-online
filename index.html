<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultimate RNG - Aura Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    html, body { width: 100%; height: 100%; background: #030307; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }

    .game-container {
      width: 100vw; height: 100vh; background: #0a0a16; display: flex; flex-direction: column; position: relative; overflow: hidden;
    }

    /* تأثيرات الشاشة النادرة جداً (إنفجار نيون) */
    @keyframes epicGlow {
      0% { box-shadow: inset 0 0 20px rgba(255,215,0,0.2); background: #0a0a16; }
      50% { box-shadow: inset 0 0 80px rgba(255,215,0,0.8); background: #1a1500; }
      100% { box-shadow: inset 0 0 20px rgba(255,215,0,0.2); background: #0a0a16; }
    }
    .epic-flash { animation: epicGlow 1.2s ease-in-out; }

    /* الشريط العلوي */
    .top-bar {
      height: 45px; background: #121224; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 2px solid #222; font-size: 13px; font-weight: bold; z-index: 20;
    }

    /* منطقة عرض الهالة المسحوبة */
    .roll-display-area {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; position: relative;
    }

    .aura-box {
      background: #131326; border: 2px solid #2a2a48; border-radius: 20px; width: 90%; max-width: 400px;
      padding: 25px 15px; box-shadow: 0 0 25px rgba(0,0,0,0.6); position: relative; overflow: hidden;
    }

    .aura-name { font-size: 22px; font-weight: bold; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    .aura-chance { font-size: 12px; color: #88a; margin-bottom: 15px; }

    /* زر ROLL الضخم والحماسي */
    .roll-action-area {
      height: 110px; background: #0d0d1c; display: flex; align-items: center; justify-content: center;
      border-top: 2px solid #222; z-index: 20;
    }
    .roll-btn {
      width: 85%; max-width: 360px; height: 65px; background: linear-gradient(45deg, #ff0055, #7700ff);
      color: #fff; font-size: 20px; font-weight: bold; border: none; border-radius: 35px;
      box-shadow: 0 0 25px rgba(255,0,85,0.6); cursor: pointer; transition: transform 0.08s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .roll-btn:active { transform: scale(0.93); }

    /* الشاشات الجانبية (المخزون والمتاجر) */
    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a16; z-index: 100; display: flex; flex-direction: column; padding: 20px; align-items: center;
    }
    .hidden { display: none !important; }
    
    .btn {
      background: #2a2a48; color: #fff; border: none; padding: 10px 20px; border-radius: 15px;
      font-weight: bold; font-size: 13px; cursor: pointer; margin: 5px;
    }

    .inventory-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px;
      overflow-y: auto; flex: 1; padding: 10px 0;
    }
    .inv-card { background: #161630; border: 1px solid #333; padding: 10px; border-radius: 12px; text-align: center; }
  </style>
</head>
<body>

  <div class="game-container" id="gameContainer">
    
    <!-- الشريط العلوي -->
    <div class="top-bar">
      <span>🎲 إجمالي السحبات: <span id="totalRolls" style="color: #ff0055;">0</span></span>
      <button class="btn" style="padding: 4px 12px; font-size: 11px;" onclick="openInventory()">حقيبة الهالات 🎒</button>
    </div>

    <!-- منطقة عرض السحب والهالات -->
    <div class="roll-display-area">
      <div class="aura-box" id="auraCardBox">
        <div style="font-size: 11px; color: #ffaa00; margin-bottom: 5px;">HOLO ROULETTE</div>
        <div class="aura-name" id="auraNameDisplay" style="color: #00ffcc;">اضغط ROLL لبدء الحظ!</div>
        <div class="aura-chance" id="auraChanceDisplay">النسبة: ---</div>
      </div>
    </div>

    <!-- زر السحب ROLL -->
    <div class="roll-action-area">
      <button class="roll-btn" id="rollBtn" onclick="rollAura()">🎲 ROLL (اسحب)</button>
    </div>

    <!-- شاشة حقيبة الهالات (Inventory) -->
    <div id="inventoryScreen" class="screen-overlay hidden">
      <h2 style="color: #ff0055; margin-bottom: 10px;">🎒 حقيبة الهالات النادرة</h2>
      <p style="font-size: 12px; color: #aaa; margin-bottom: 10px;">الهالات التي قمت بسحبها:</p>
      <div class="inventory-grid" id="inventoryGrid">
        <!-- عناصر المخزون تظهر هنا -->
      </div>
      <button class="btn" style="background: #ff0055; margin-top: 10px;" onclick="closeInventory()">رجوع للعبة ↩</button>
    </div>

  </div>

  <script>
    // قائمة الهالات مع نسب الحظ (من الشائع إلى 1 في المليار!)
    const auras = [
      { name: "Common (عادي)", chance: 2, color: "#aaa", rarity: "شائع" },
      { name: "Good (جيد)", chance: 10, color: "#00ffcc", rarity: "عادي" },
      { name: "Rare (نادر)", chance: 50, color: "#0088ff", rarity: "نادر" },
      { name: "Epic (ملحمي)", chance: 500, color: "#9900ff", rarity: "ملحمي" },
      { name: "Legendary (أساطير)", chance: 5000, color: "#ffaa00", rarity: "أسطوري" },
      { name: "Mythic (خرافي)", chance: 50000, color: "#ff0055", rarity: "خرافي" },
      { name: "DIVINE (إلهي)", chance: 1000000, color: "#ffff00", rarity: "إلهي ⚡" },
      { name: "⭐ UNIVERSE (الكون المطلق)", chance: 1000000000, color: "#00ffff", rarity: "1 in 1B 🌌" }
    ];

    let totalRolls = 0;
    let inventory = {}; // لتخزين الهالات المكتسبة

    window.onload = () => {
      let saved = localStorage.getItem('ultimateRngSave');
      if(saved) {
        let data = JSON.parse(saved);
        totalRolls = data.totalRolls || 0;
        inventory = data.inventory || {};
      }
      document.getElementById('totalRolls').innerText = totalRolls;
    };

    function saveGame() {
      localStorage.setItem('ultimateRngSave', JSON.stringify({ totalRolls, inventory }));
      document.getElementById('totalRolls').innerText = totalRolls;
    }

    function rollAura() {
      totalRolls++;
      
      // محاكاة حظ تصاعدي مثير
      let rand = Math.floor(Math.random() * 1000000000) + 1;
      let selectedAura = auras[0];

      // فحص النسب من الأندر للأسهل
      for(let i = auras.length - 1; i >= 0; i--) {
        if(rand <= auras[i].chance || i === 0) {
          selectedAura = auras[i];
          break;
        }
      }

      // تأثيرات بصرية فخمة لو طلعت هالة نادرة جداً (أقل من 1 في 5000)
      let container = document.getElementById('gameContainer');
      if(selectedAura.chance >= 5000) {
        container.classList.remove('epic-flash');
        void container.offsetWidth; // إعادة تشغيل الـ Animation
        container.classList.add('epic-flash');
      }

      // عرض النتيجة
      let nameEl = document.getElementById('auraNameDisplay');
      let chanceEl = document.getElementById('auraChanceDisplay');
      
      nameEl.innerText = selectedAura.name;
      nameEl.style.color = selectedAura.color;
      chanceEl.innerText = `الندرة: 1 in ${selectedAura.chance.toLocaleString()} (${selectedAura.rarity})`;

      // إضافة الهالة للمخزون
      if(!inventory[selectedAura.name]) {
        inventory[selectedAura.name] = { count: 0, color: selectedAura.color };
      }
      inventory[selectedAura.name].count++;
      saveGame();
    }

    function openInventory() {
      let grid = document.getElementById('inventoryGrid');
      grid.innerHTML = "";

      let keys = Object.keys(inventory);
      if(keys.length === 0) {
        grid.innerHTML = `<div style="grid-column: span 2; color: #888; font-size: 12px; margin-top: 20px;">لم تحصل على أي هالات بعد، اضغط ROLL!</div>`;
      } else {
        keys.forEach(key => {
          let item = document.createElement('div');
          item.className = 'inv-card';
          item.innerHTML = `
            <div style="font-weight: bold; font-size: 12px; color: ${inventory[key].color};">${key}</div>
            <div style="font-size: 11px; color: #aaa; margin-top: 4px;">العدد: ${inventory[key].count}</div>
          `;
          grid.appendChild(item);
        });
      }

      document.getElementById('inventoryScreen').classList.remove('hidden');
    }

    function closeInventory() {
      document.getElementById('inventoryScreen').classList.add('hidden');
    }
  </script>
</body>
</html>
