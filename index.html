<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA RNG - Touch Fixed Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body, html { width: 100%; height: 100%; background: #050714; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    .app { width: 100vw; height: 100vh; max-width: 500px; background: radial-gradient(circle at center, #0f162e 0%, #050714 100%); display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    
    .top-bar { height: 50px; background: rgba(10, 14, 29, 0.95); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #1a2542; }
    .brand { font-weight: 900; font-size: 13px; color: #38ef7d; }
    .brand span { color: #00c6ff; }
    .stats { display: flex; gap: 5px; }
    .badge { background: #11182a; border: 1px solid #1f2d4e; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 700; color: #b0c4de; }
    .badge span { color: #fff; }

    .main-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    .equipped { background: rgba(16, 24, 46, 0.85); border: 1px solid #25365d; padding: 4px 14px; border-radius: 20px; font-size: 11px; color: #8da3d0; margin-bottom: 12px; }
    .equipped span { color: #38ef7d; font-weight: bold; }

    .card { width: 85%; max-width: 320px; height: 190px; background: rgba(14, 21, 41, 0.8); border: 2px solid #213259; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(0,0,0,0.8); }
    .orb { width: 60px; height: 60px; border-radius: 50%; background: #fff; box-shadow: 0 0 25px rgba(255,255,255,0.9); margin-bottom: 10px; }
    .c-title { font-size: 16px; font-weight: 900; text-transform: uppercase; margin-bottom: 6px; text-align: center; }
    .rarity { background: #0d1324; border: 1px solid #23345a; padding: 3px 12px; border-radius: 12px; font-size: 10px; font-weight: 700; color: #a0b6e0; display: flex; gap: 6px; }

    .bottom-bar { height: 105px; background: rgba(8, 12, 24, 0.98); display: flex; align-items: center; justify-content: space-around; padding: 10px 10px 30px 10px; border-top: 1px solid #1a2542; }
    .btn-sec { background: #121a30; border: 1px solid #202e52; color: #9cb3e0; padding: 10px 16px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .btn-sec:active { transform: scale(0.92); }

    .roll-wrap { position: relative; }
    .roll-btn { background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%); border: none; color: #fff; padding: 10px 28px; border-radius: 16px; font-size: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(0,114,255,0.6); display: flex; flex-direction: column; align-items: center; }
    .roll-btn:active { transform: scale(0.92); }
    .roll-btn.disabled { opacity: 0.5; pointer-events: none; }
    .cd-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #00f0ff; }

    .modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,7,18,0.96); backdrop-filter: blur(10px); z-index: 50; display: flex; flex-direction: column; padding: 15px; align-items: center; }
    .hidden { display: none !important; }
    .m-header { width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1a2646; padding-bottom: 8px; }
    .m-title { font-size: 15px; font-weight: 800; color: #38ef7d; }
