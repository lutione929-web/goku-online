<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goku Fighter Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:5px;touch-action:none}
    
    /* شاشة تسجيل الدخول */
    #loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px}
    .login-box{background:#1e272e;border:2px solid #ff7675;padding:25px;border-radius:12px;text-align:center;width:100%;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
    .login-box h2{color:#ff7675;margin-bottom:15px;font-size:1.3rem}
    .login-box input{width:100%;padding:10px;border-radius:8px;border:none;background:#2d3436;color:#fff;font-size:1rem;margin-bottom:12px;text-align:center}
    .login-box button{width:100%;background:#0984e3;color:#fff;border:none;padding:10px;border-radius:8px;font-size:1rem;cursor:pointer;font-weight:bold}
    .error-msg{color:#d63031;font-size:0.75rem;margin-top:5px;display:block}

    #gameUI{display:none;flex-direction:column;align-items:center;width:100%}

    h1{font-size:1.2rem;margin:3px 0;background:linear-gradient(90deg,#ff7675,#fab1a0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    
    .menu-bar{display:flex;gap:8px;margin-bottom:5px}
    .menu-btn{background:#e17055;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:0.75rem;cursor:pointer}

    #gameCanvas{background:#1e272e;border:2px solid #ff7675;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.5)}
    
    .ki-container{width:320px;background:#2d3436;border-radius:6px;margin-top:5px;overflow:hidden;border:1px solid #ff7675;height:14px;position:relative}
    .ki-fill{height:100%;background:linear-gradient(90deg,#0984e3,#00cec9);width:0%;transition:width 0.2s}
    .ki-text{position:absolute;width:100%;top:0;text-align:center;font-size:0.65rem;font-weight:bold;color:#fff}

    .chat-box{width:320px;height:50px;background:#1e272e;border:1px solid #444;border-radius:6px;margin-top:5px;padding:4px;overflow-y:auto;font-size:0.75rem;text-align:right}
    .chat-input-area{display:flex;gap:4px;width:320px;margin-top:4px}
    .chat-input-area input{flex:1;padding:5px;border-radius:6px;border:none;background:#2d3436;color:#fff;font-size:0.75rem}
    .chat-input-area button{background:#0984e3;color:#fff;border:none;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:0.75rem}

    /* عصا التحكم Joystick السلسة */
    .joystick-area{width:320px;height:105px;background:#1e272e;border:2px dashed #ff7675;border-radius:10px;margin-top:6px;display:flex;align-items:center;justify-content:center;position:relative;user-select:none}
    .joystick-knob{width:50px;height:50px;background:#ff7675;border-radius:50%;position:absolute;box-shadow:0 4px 10px rgba(0,0,0,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
    
    .action-bar{display:flex;gap:8px;margin-top:6px;width:320px;justify-content:center}
    .btn-action{flex:1;padding:9px;border-radius:6px;border:none;color:#fff;font-weight:bold;cursor:pointer;font-size:0.8rem}
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول والتحقق من التوثيق والاسم -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>⚡ Goku Fighter Login</h2>
      <input type="text" id="playerNameInput" placeholder="Enter name (English only)">
      <button onclick="joinGame()">دخول اللعبة</button>
      <span class="error-msg" id="errorMsg"></span>
    </div>
  </div>

  <!-- واجهة اللعبة الأساسية -->
  <div id="gameUI">
    <h1>⚡ Goku Fighter Online</h1>
    
    <div class="menu-bar">
      <button class="menu-btn" onclick="openShop()">🛒 المتجر</button>
      <button class="menu-btn" onclick="addFriend()">👥 أصدقاء</button>
      <button class="menu-btn" style="background:#6c5ce7" onclick="transformGoku()">🔥 التحول (SSJ)</button>
    </div>

    <canvas id="gameCanvas" width="320" height="170"></canvas>

    <div class="ki-container">
      <div class="ki-fill" id="kiFill"></div>
      <div class="ki-text" id="kiText">طاقة Ki: 0%</div>
    </div>

    <div class="chat-box" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="msgInput" placeholder="اكتب رسالتك...">
      <button onclick="sendChat()">إرسال</button>
    </div>

    <div class="action-bar">
      <button class="btn-action" style="background:#6c5ce7" onclick="chargeKi()">⚡ شحن Ki</button>
      <button class="btn-action" style="background:#d63031" onclick="useKamehameha()">💥 كامیهامیها</button>
    </div>

    <!-- الـ Joystick للتحكم بالسحب المستمر -->
    <div class="joystick-area" id="joystickArea">
      <div class="joystick-knob" id="joystickKnob">🕹️</div>
    </div>
  </div>

  <script>
    let socket;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let players = {};
    let myId = null;
    let myName = "";
    let isDev = false;
    let ki = 0;
    let isSuperSaiyan = false;
    let moveVector = { x: 0, y: 0 };
    let isDragging = false;

    function joinGame() {
      const input = document.getElementById('playerNameInput');
      const nameVal = input.value.trim();
      const errorSpan = document.getElementById('errorMsg');

      const englishRegex = /^[A-Za-z0-9_]{3,12}$/;
      if (!englishRegex.test(nameVal)) {
        errorSpan.innerText = "⚠️ اسم إنجليزي غير صالح (3 لـ 12 حرف بدون مسافات أو عربي)!";
        return;
      }

      // تحديد تلقائي لتوثيق المطور لو كان اسمك EPIKDEV أو MOHAMMED
      isDev = (nameVal.toUpperCase() === 'EPIKDEV' || nameVal.toUpperCase() === 'MOHAMMED');

      socket = io();

      socket.emit('playerJoin', { id: socket.id, name: nameVal, isDev: isDev, x: 140, y: 70, ssj: false, action: 'normal' }, (response) => {
        if (!response.success) {
          errorSpan.innerText = "⚠️ " + response.message;
          socket.disconnect();
        } else {
          myName = nameVal;
          myId = socket.id;
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('gameUI').style.display = 'flex';
          initGameListeners();
        }
      });
    }

    function initGameListeners() {
      socket.on('currentPlayers', (serverPlayers) => {
        players = serverPlayers;
        draw();
      });

      socket.on('playerMove', (data) => {
        players[data.id] = data;
        draw();
      });

      socket.on('playerAction', (data) => {
        if(players[data.id]) {
          players[data.id].action = data.action;
          players[data.id].ssj = data.ssj;
          draw();
          setTimeout(() => { players[data.id].action = 'normal'; draw(); }, 600);
        }
      });

      socket.on('disconnect', (id) => {
        delete players[id];
        draw();
      });

      socket.on('chatMessage', (data) => {
        const box = document.getElementById('chatMessages');
        let badge = data.isDev ? ' <span style="color:#f1c40f">[👑 DEV]</span>' : '';
        box.innerHTML += `<div><b>${data.name}${badge}:</b> ${data.text}</div>`;
        box.scrollTop = box.scrollHeight;
      });

      setInterval(updateMovement, 25);
    }

    // إعدادات عصا التحكم الـ Joystick
    const area = document.getElementById('joystickArea');
    const knob = document.getElementById('joystickKnob');

    function handleTouch(e) {
      e.preventDefault();
      const rect = area.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let dx = clientX - (rect.left + rect.width / 2);
      let dy = clientY - (rect.top + rect.height / 2);
      let dist = Math.sqrt(dx * dx + dy * dy);
      let maxDist = 40;

      if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
      }

      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      moveVector = { x: dx / maxDist, y: dy / maxDist };
      isDragging = true;
    }

    function endTouch() {
      knob.style.transform = `translate(0px, 0px)`;
      moveVector = { x: 0, y: 0 };
      isDragging = false;
    }

    area.addEventListener('touchstart', handleTouch);
    area.addEventListener('touchmove', handleTouch);
    area.addEventListener('touchend', endTouch);

    area.addEventListener('mousedown', (e) => {
      window.addEventListener('mousemove', handleTouch);
      window.addEventListener('mouseup', () => {
        window.removeEventListener('mousemove', handleTouch);
        endTouch();
      }, { once: true });
      handleTouch(e);
    });

    // تحديث الحركة ومنع التعليق عند الحواف تماماً
    function updateMovement() {
      if (!myId || !players[myId] || !isDragging) return;

      const speed = 4.5;
      let newX = players[myId].x + moveVector.x * speed;
      let newY = players[myId].y + moveVector.y * speed;

      const maxX = canvas.width - 26;
      const maxY = canvas.height - 26;

      if (newX < 2) newX = 2;
      if (newX > maxX) newX = maxX;
      if (newY < 2) newY = 2;
      if (newY > maxY) newY = maxY;

      players[myId].x = newX;
      players[myId].y = newY;

      draw();
      socket.emit('playerMove', { id: myId, x: newX, y: newY, name: myName, isDev: isDev, ssj: isSuperSaiyan });
    }

    function chargeKi() {
      if(ki < 100) {
        ki += 15;
        if(ki > 100) ki = 100;
        updateKiBar();
      }
    }

    function updateKiBar() {
      document.getElementById('kiFill').style.width = ki + '%';
      document.getElementById('kiText').innerText = `طاقة Ki: ${ki}%`;
    }

    function transformGoku() {
      if(ki >= 100) {
        isSuperSaiyan = true;
        players[myId].ssj = true;
        draw();
        socket.emit('playerAction', { id: myId, action: 'transform', ssj: true });
        alert("⚡ تحول Goku إلى Super Saiyan الأسطوري!");
      } else {
        alert("❌ طاقة Ki غير كافية للتحول! اشحن الطاقة حتى 100%");
      }
    }

    function useKamehameha() {
      if(!myId || !players[myId]) return;
      players[myId].action = 'kamehameha';
      draw();
      socket.emit('playerAction', { id: myId, action: 'kamehameha', ssj: isSuperSaiyan });
      if(ki > 20) ki -= 20;
      updateKiBar();
    }

    function sendChat() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if(text !== '') {
        socket.emit('chatMessage', { name: myName, isDev: isDev, text: text });
        input.value = '';
      }
    }

    function openShop() { alert("🛒 المتجر قريباً!"); }
    function addFriend() { prompt("أدخل اسم صديقك لإضافته:"); }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let id in players) {
        const p = players[id];
        let baseColor = p.ssj ? '#fdcb6e' : '#ff7675';

        if(p.action === 'kamehameha') {
          ctx.fillStyle = '#0984e3';
          ctx.beginPath();
          ctx.arc(p.x + 13, p.y + 13, 24, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = baseColor;
        ctx.beginPath();
        ctx.arc(p.x + 13, p.y + 13, 12, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = p.ssj ? '#e1b12c' : '#2d3436';
        ctx.fillRect(p.x + 8, p.y + 2, 10, 5);

        // رسم التوثيق الذهبي للمطور فوق الشخصية مباشرة
        ctx.fillStyle = p.isDev ? '#f1c40f' : '#fff';
        ctx.font = p.isDev ? 'bold 10px sans-serif' : '9px sans-serif';
        ctx.textAlign = 'center';
        let displayName = p.isDev ? `[👑 DEV] ${p.name}` : (p.name || 'Goku');
        ctx.fillText(displayName, p.x + 13, p.y + 28);
      }
    }
  </script>
</body>
</html>
