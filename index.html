<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goku Fighter Online</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0a0a12;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:10px}
    h1{font-size:1.5rem;margin:8px 0;background:linear-gradient(90deg,#ff7675,#e17055);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .panel{background:#1e272e;border:2px solid #ff7675;border-radius:12px;padding:16px;width:100%;max-width:360px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
    input,button{font-family:inherit;font-size:1rem;border:none;border-radius:8px;padding:10px;margin:4px 0;width:100%}
    input{width:100%;margin:6px 0;text-align:center;background:#2d3436;color:#fff}
    button{cursor:pointer;color:#fff;margin-top:6px;font-weight:bold}
    .btn-main{background:linear-gradient(90deg,#e17055,#d63031)}
    #status{opacity:.8;font-size:.9rem;margin-bottom:8px;text-align:center;color:#00b894}
    #gameWrap{display:none;position:relative;margin-top:10px}
    canvas{display:block;max-width:100%;background:#111;border:2px solid #ff7675;border-radius:8px}
    .hidden{display:none!important}
  </style>
</head>
<body>

  <h1>Goku Fighter Online ⚡</h1>
  <div id="status">جاهز للعب!</div>

  <div id="menu" class="panel">
    <label>اسمك</label>
    <input type="text" id="nameInput" value="EPIKDEV">
    <button class="btn-main" onclick="startGame()">دخول اللعبة 🚀</button>
  </div>

  <div id="gameWrap">
    <canvas id="canvas" width="360" height="480"></canvas>
  </div>

  <script>
    function startGame() {
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('gameWrap').style.display = 'block';
      document.getElementById('status').innerText = 'جاري اللعب...';
      initGame();
    }

    function initGame() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      let p = { x: 180, y: 240, r: 25, color: '#e17055' };

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '14px Tahoma';
        ctx.textAlign = 'center';
        ctx.fillText(document.getElementById('nameInput').value, p.x, p.y + 40);
        requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
</body>
</html>
