<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shadow Ninja Runner - Ultimate</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    html, body { width: 100%; height: 100%; background: #050508; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; }

    .game-container {
      width: 100vw; height: 100vh; background: #0a0a14; display: flex; flex-direction: column; position: relative; overflow: hidden;
    }

    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0a14; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    .hidden { display: none !important; }

    h1 { font-size: 26px; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.6); margin-bottom: 8px; }
    p { font-size: 13px; color: #88a; margin-bottom: 15px; }

    .btn {
      background: linear-gradient(45deg, #00ffcc, #0077ff); color: #000; border: none;
      padding: 12px 28px; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer;
      box-shadow: 0 0 18px rgba(0,255,204,0.4); margin: 6px;
    }
    .btn:active { transform: scale(0.92); }

    .top-bar {
      height: 40px; background: #10101c; display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; border-bottom: 1px solid #223; font-size: 12px; font-weight: bold; z-index: 20;
    }

    .game-canvas {
      flex: 1; position: relative; background: #070710; overflow: hidden;
    }

    /* النينجا والعقبات */
    .ninja {
      position: absolute; left: 60px; bottom: 30px; width: 28px; height: 32px;
      background: #00ffcc; border-radius: 6px; box-shadow: 0 0 15px #00ffcc; z-index: 10;
    }
    .ground {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 30px;
      background: linear-gradient(90deg, #16162c, #222244); border-top: 2px solid #00ffcc; z-index: 5;
    }
    .obstacle {
      position: absolute; bottom: 30px; width: 22px; height: 26px;
      background: #ff0055; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); z-index: 6;
    }
    .coin {
      position: absolute; bottom: 70px; width: 18px; height: 18px;
      background: #ffaa00; border-radius: 50%; box-shadow: 0 0 10px #ffaa00; z-index: 6;
    }

    /* زر القفز الكبير يملأ الشاشة لتسهيل اللعب */
    .jump-zone {
      height: 100px; background: #0c0c18; display: flex; align-items: center; justify-content: center;
      border-top: 1px solid #223; z-index: 20;
    }
    .big-jump-btn {
      width: 90%; max-width: 350px; height: 60px; background: linear-gradient(45deg, #00ffcc, #0088ff);
      color: #000; font-size: 18px; font-weight: bold; border: none; border-radius: 30px;
      box-shadow: 0 0 20px rgba(0,255,204,0.5); cursor: pointer;
    }
    .big-jump-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- القائمة الرئيسية -->
    <div id="mainMenu" class="overlay-screen">
      <h1>🥷 SHADOW NINJA RUN</h1>
      <p>اضغط للقفز وتفادي الشوك واجمع الجواهر!</p>
      <p style="color: #ffaa00; font-weight: bold;">أعلى نتيجة: <span id="highScoreTxt">0</span></p>
      <button class="btn" onclick="startGame()">ابدأ الجري الحماسي ⚡</button>
    </div>

    <!-- الشريط العلوي -->
    <div class="top-bar">
      <span>النقاط: <span id="scoreTxt" style="color: #00ffcc;">0</span></span>
      <span>💎 <span id="gemsTxt">0</span></span>
      <button class="btn" style="padding: 3px 10px; font-size: 10px;" onclick="returnMenu()">قائمة</button>
    </div>

    <!-- مسرح اللعبة -->
    <div class="game-canvas" id="canvas">
      <div class="ninja" id="ninja"></div>
      <div class="ground"></div>
    </div>

    <!-- زر التحكم بالقفز -->
    <div class="jump-zone">
      <button class="big-jump-btn" ontouchstart="jumpNinja()" onclick="jumpNinja()">⬆ اضغط للقفز (Jump)</button>
    </div>

  </div>

  <script>
    let score = 0;
    let gems = 0;
    let highScore = 0;
    let ny = 30;
    let nvy = 0;
    let isJumping = false;
    let gameActive = false;
    let gameInterval = null;
    let obstacles = [];
    let gameSpeed = 6;

    window.onload = () => {
      let saved = localStorage.getItem('ninjaRunnerSave');
      if(saved) {
        let data = JSON.parse(saved);
        highScore = data.highScore || 0;
        gems = data.gems || 0;
      }
      document.getElementById('highScoreTxt').innerText = highScore;
      document.getElementById('gemsTxt').innerText = gems;
    };

    function saveGame() {
      if(score > highScore) highScore = score;
      localStorage.setItem('ninjaRunnerSave', JSON.stringify({ highScore, gems }));
      document.getElementById('highScoreTxt').innerText = highScore;
      document.getElementById('gemsTxt').innerText = gems;
    }

    function startGame() {
      document.getElementById('mainMenu').classList.add('hidden');
      score = 0;
      gameSpeed = 6;
      ny = 30;
      nvy = 0;
      isJumping = false;
      gameActive = true;
      
      // مسح العوائق القديمة
      document.querySelectorAll('.obstacle, .coin').forEach(e => e.remove());
      obstacles = [];

      if(gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(updateGame, 20);
    }

    function returnMenu() {
      gameActive = false;
      if(gameInterval) clearInterval(gameInterval);
      document.getElementById('mainMenu').classList.remove('hidden');
      saveGame();
    }

    function jumpNinja() {
      if(!gameActive) return;
      if(!isJumping) {
        nvy = 13;
        isJumping = true;
      }
    }

    function updateGame() {
      if(!gameActive) return;

      // جاذبية
      nvy -= 0.7;
      ny += nvy;
      if(ny <= 30) {
        ny = 30;
        nvy = 0;
        isJumping = false;
      }

      let ninjaEl = document.getElementById('ninja');
      ninjaEl.style.bottom = ny + 'px';

      score += 1;
      document.getElementById('scoreTxt').innerText = score;

      // زيادة السرعة تدريجياً
      if(score % 200 === 0) gameSpeed += 1;

      // توليد عوائق وجواهر عشوائية
      if(Math.random() < 0.02) {
        createObstacle();
      }

      // تحريك العوائق
      let canvas = document.getElementById('canvas');
      let canvasWidth = canvas.clientWidth;

      // تحديث مكان النينجا أفقياً للأمان
      let obsList = document.querySelectorAll('.obstacle, .coin');
      obsList.forEach(obs => {
        let right = parseFloat(obs.style.right || '0');
        right += gameSpeed;
        obs.style.right = right + 'px';

        // فحص الاصطدام بالشوك
        if(obs.classList.contains('obstacle') && right > canvasWidth - 100 && right < canvasWidth - 50) {
          if(ny < 55) {
            // صدمة خسران
            gameActive = false;
            alert("💥 اصطدمت بالشوك! انتهت اللعبة. نقاطك: " + score);
            saveGame();
            returnMenu();
          }
        }

        // إزالة العناصر التي خرجت من الشاشة
