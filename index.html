<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA RNG - Ultra Simulator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #050714;
      color: #ffffff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 100%;
      height: 100%;
      max-width: 900px;
      max-height: 100vh;
      background: radial-gradient(circle at center, #0f162e 0%, #050714 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* Top Stats Bar */
    .top-bar {
      height: 50px;
      background: rgba(10, 14, 29, 0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #1a2542;
      z-index: 10;
      flex-shrink: 0;
    }

    .brand {
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      color: #38ef7d;
    }

    .brand span {
      color: #00c6ff;
    }

    .stats-group {
      display: flex;
      gap: 6px;
    }

    .stat-badge {
      background: #11182a;
      border: 1px solid #1f2d4e;
      padding: 4px 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #b0c4de;
    }

    .stat-badge .val {
      color: #ffffff;
      font-weight: 800;
    }

    /* Main Aura Display - ضبط المسافات لرفع الأزرار */
    .display-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      width: 100%;
      overflow: hidden;
    }

    .equipped-pill {
      background: rgba(16, 24, 46, 0.85);
      border: 1px solid #25365d;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: #8da3d0;
      margin-bottom: 10px;
      z-index: 2;
    }

    .equipped-pill span {
      color: #38ef7d;
      font-weight: bold;
    }

    .aura-card {
      width: 88%;
      max-width: 340px;
      height: 180px;
      background: rgba(14, 21, 41, 0.75);
      border: 2px solid #213259;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .aura-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.9);
      margin-bottom: 10px;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .aura-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-align: center;
    }

    .rarity-pill {
      background: #0d1324;
      border: 1px solid #23345a;
      padding: 3px 12px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      color: #a0b6e0;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* Bottom Control Bar - مرفع ومكشوف بالكامل */
    .bottom-controls {
      height: 90px;
      background: rgba(8, 12, 24, 0.98);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 10px 15px 20px 15px;
      border-top: 1px solid #1a2542;
      z-index: 10;
      flex-shrink: 0;
    }

    .btn-secondary {
      background: #121a30;
      border: 1px solid #202e52;
      color: #9cb3e0;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary:active {
      transform: scale(0.92);
      background: #182442;
    }

    .roll-btn-wrapper {
      position: relative;
    }
