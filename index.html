<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Level Devil - Ultimate Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    /* حاوية العرض الأفقية للجوال */
    .game-container {
      width: 100vw; height: 100vh; max-width: 900px; max-height: 450px; background: #111;
      position: relative; overflow: hidden; display: flex; flex-direction: column; border: 3px solid #333;
    }

    /* الشاشات والقوائم */
    .screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0f1a; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    .hidden { display: none !important; }

    h1 { font-size: 24px; color: #ff0055; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,0,85,0.5); }
    p { font-size: 12px; color: #aaa; margin-bottom: 15px; }

    .btn {
      background: linear-gradient(45deg, #ff0055, #7700ff); color: #fff; border: none;
      padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer;
      box-shadow: 0 0 15px rgba(255,0,85,0.4); margin: 5px;
    }
    .btn:active { transform: scale(0.95); }

    input {
      padding: 8px 15px; border-radius: 15px; border: 1px solid #444; background: #222; color: #fff;
      font-size: 12px; text-align: center; margin-bottom: 10px; outline: none;
    }

    /* شريط العلوي للعبة */
    .top-bar {
      height: 40px; background: #1a1a2e; display: flex; align-items: center; justify-content: space-between;
      padding: 0 15px; border-bottom: 2px solid #333; font-size: 12px; font-weight: bold; z-index: 10;
    }

    /* منطقة اللعب */
    .game-canvas-area {
      flex: 1; position: relative; background: #141422; overflow: hidden;
    }

    /* عناصر اللعبة */
    .player {
      position: absolute; width: 24px; height: 24px; background: #00ffcc; border-radius: 6px;
      box-shadow: 0 0 10px #00ffcc; z-index: 5;
    }
    .platform {
      position: absolute; background: #ff5500; border-radius: 4px; z-index: 2;
    }
    .spike {
      position: absolute; width: 20px; height: 16px; background: #ff0000; clip-path: polygon(50% 0%, 0% 100%, 100% 100%); z-index: 2;
    }
    .coin {
      position: absolute; width: 16px; height: 16px; background: #ffea00; border-radius: 50%;
      box-shadow: 0 0 8px #ffea00; z-index: 2; animation: bounce 0.5s infinite alternate;
    }
    .door {
      position: absolute; width: 28px; height: 36px; background: #9900ff; border-radius: 4px;
      box-shadow: 0 0 12px #9900ff; z-index: 2;
    }

    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }

    /* أزرار التحكم السفلیة للجوال (أفقي) */
    .controls-bar {
      height: 55px; background: #161625; display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 10; border-top: 1px solid #333;
    }
    .control-group { display: flex; gap: 10px; }
    .ctrl-btn {
      width: 45px; height: 38px; background: #2a2a40; color: #fff; border: 1px solid #444;
      border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .ctrl-btn:active { background: #ff0055; }

    /* متجر وسكنات */
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
    .shop-item { background: #1c1c2d; border: 1px solid #333; padding: 8px; border-radius: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="game-container">
    
    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen" class="screen">
      <h1>😈 LEVEL DEVIL</h1>
      <p>أدخل اسمك لح
