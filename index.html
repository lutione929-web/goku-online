<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montagem Eclipse - Beat Maker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: #07070b;
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; display: flex; flex-direction: column; z-index: 50; color: #fff; padding: 12px;
    }

    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 6px;
    }
    .app-title { font-size: 11px; font-weight: bold; background: linear-gradient(45deg, #ff0055, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* شبكة أزرار الفونك */
    .pad-grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 8px; margin-bottom: 8px;
    }

    .pad-btn {
      border-radius: 12px; border: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.05s, filter 0.05s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.95);
    }
    .pad-btn:active, .pad-btn.active-glow {
      transform: scale(0.92);
      filter: brightness(1.8);
      box-shadow: 0 0 25px currentColor;
    }

    .p-cowbell { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; }
    .p-808     { background: linear-gradient(135deg, #7700ff, #ff00aa); color: #ffccff; }
    .p-bass    { background: linear-gradient(135deg, #111122, #333355); color: #00ffcc; border: 1px solid #00ffcc; }
    .p-vocal   { background: linear-gradient(135deg, #00f0ff, #0044ff); color: #ccffff; }
    .p-synth   { background: linear-gradient(135deg, #ffea00, #ff5500); color: #ffff99; }
    .p-kick    { background: linear-gradient(135deg, #ff0000, #880000); color: #ff9999; }

    .control-panel {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .eclipse-btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer;
      background: linear-gradient(45deg, #ff0055, #7700ff); color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.5);
    }
    .eclipse-btn.active {
      background: linear-gradient(45deg, #00ffcc, #0088ff); color: #000;
    }

    .status-bar-dj {
      background: #141620; padding: 6px; border-radius: 8px; text-align: center; font-size: 10px; color: #ff0055; border: 1px solid #222; font-weight: bold;
    }

    .home-bar-area { height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="phone-screen">
      
      <div class="app-window">
        <div class="app-header">
          <span class="app-title">🌑 MONTAGEM ECLIPSE (SOUND ENGINE)</span>
          <span style="font-size: 10px; color: #00ffcc;" id="eclipseBadge">● READY</span>
        </div>

        <div class="control-panel">
          <button class="eclipse-btn" id="eclipseToggleBtn" onclick="toggleLoop()">▶ تشغيل رتم Eclipse التلقائي</button>
        </div>

        <!-- أزرار الإيقاع الفورية -->
        <div class="pad-grid">
          <button class="pad-btn p-cowbell" id="p1" onclick="playSound(650, 'square', 'BELL HIGH')">🔔 <span>BELL HIGH</span></button>
          <button class="pad-btn p-cowbell" id="p2" onclick="playSound(520, 'square', 'BELL LOW')">🔔 <span>BELL LOW</span></button>
          <button class="pad-btn p-808"     id="p3" onclick="playSound(110, 'sawtooth', '808 SLIDE')">🎸 <span>808 SLIDE</span></button>
          
          <button class="pad-btn p-bass"    id="p4" onclick="playSound(55, 'sawtooth', 'SUB BASS')">🔊 <span>SUB BASS</span></button>
          <button class="pad-btn p-synth"   id="p5" onclick="playSound(380, 'triangle', 'LEAD')">🎹 <span>LEAD SYNTH</span></button>
          <button class="pad-btn p-kick"    id="p6" onclick="playSound(90, 'sine', 'HEAVY KICK')">🥁 <span>HEAVY KICK</span></button>
          
          <button class="pad-btn p-vocal"   id="p7" onclick="playSound(500, 'square', 'HEY CHOP')">🎤 <span>HEY! CHOP</span></button>
          <button class="pad-btn p-808"     id="p8" onclick="playSound(800, 'square', 'RUSH BELL')">⚡ <span>RUSH BELL</span></button>
          <button class="pad-btn p-synth"   id="p9" onclick="playSound(950, 'sawtooth', 'CREEP FX')">🌀 <span>CREEP FX</span></button>
          
          <button class="pad-btn p-bass"    id="p10" onclick="playSound(75, 'sawtooth', 'DIST BASS')">🔥 <span>DIST BASS</span></button>
          <button class="pad-btn p-kick"    id="p11" onclick="playSound(240, 'triangle', 'SNARE')">💥 <span>SNARE</span></button>
          <button class="pad-btn p-cowbell" id="p12" onclick="playSound(350, 'square', 'DROP BELL')">🔥 <span>DROP BELL</span></button>
        </div>

        <div class="status-bar-dj" id="djStatus">اضغط أي زر، والصوت سيشتعل فوراً! 🎶</div>
      </div>

    </div>

    <div class="home-bar-area">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    let isLooping = false;
    let loopTimer = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(freq, type, name) {
      let ctx = getAudioContext();
      let now = ctx.currentTime;

      let osc = ctx.createOscillator();
      let gain = ctx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      
      if(type === 'sine') {
        // كيك قوي
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
        gain.gain.setValueAtTime(1.0, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
      } else if(type === 'square') {
        // كاوبيل فونك
        osc.frequency.exponentialRampToValueAtTime(freq * 0.75, now + 0.12);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      } else {
        // باس وسينث
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      }

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);

      document.getElementById('djStatus').innerText = `⚡ تفاعل: [ ${name} ]`;
    }

    function toggleLoop() {
      getAudioContext();
      let btn = document.getElementById('eclipseToggleBtn');
      let badge = document.getElementById('eclipseBadge');

      if (!isLooping) {
        isLooping = true;
        btn.classList.add('active');
        btn.innerText = "⏹ إيقاف الرتم التلقائي";
        badge.innerText = "● PLAYING";

        let sequence = [
          {f: 90, t: 'sine', id: 'p6'},
          {f: 650, t: 'square', id: 'p1'},
          {f: 55, t: 'sawtooth', id: 'p4'},
          {f: 520, t: 'square', id: 'p2'},
          {f: 90, t: 'sine', id: 'p6'},
          {f: 110, t: 'sawtooth', id: 'p3'},
          {f: 500, t: 'square', id: 'p7'},
          {f: 650, t: 'square', id: 'p1'}
        ];

        let index = 0;
        loopTimer = setInterval(() => {
          let item = sequence[index % sequence.length];
          let pad = document.getElementById(item.id);
          if(pad) {
            pad.click();
          }
          index++;
        }, 160);

        document.getElementById('djStatus').innerText = "🔥 رتم Eclipse البرازيلي يشتغل تلقائياً!";
      } else {
        isLooping = false;
        clearInterval(loopTimer);
        btn.classList.remove('active');
        btn.innerText = "▶ تشغيل رتم Eclipse التلقائي";
        badge.innerText = "● READY";
        document.getElementById('djStatus').innerText = "تم إيقاف الرتم.";
      }
    }
  </script>
</body>
</html>
