<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Montagem Eclipse - Official Beat Maker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 35px rgba(255, 0, 85, 0.6); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: #07070b;
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #0b0c10; display: flex; flex-direction: column; z-index: 50; color: #fff; padding: 12px;
    }

    .app-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; border-bottom: 1px solid #222; padding-bottom: 6px;
    }
    .app-title { font-size: 11px; font-weight: bold; background: linear-gradient(45deg, #ff0055, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* شبكة أزرار الفونك */
    .pad-grid {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr);
      gap: 8px; margin-bottom: 8px;
    }

    .pad-btn {
      border-radius: 12px; border: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.05s, filter 0.05s;
      display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: rgba(255,255,255,0.95);
    }
    .pad-btn:active, .pad-btn.active-glow {
      transform: scale(0.92);
      filter: brightness(1.8);
      box-shadow: 0 0 25px currentColor;
    }

    .p-cowbell { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; }
    .p-808     { background: linear-gradient(135deg, #7700ff, #ff00aa); color: #ffccff; }
    .p-bass    { background: linear-gradient(135deg, #111122, #333355); color: #00ffcc; border: 1px solid #00ffcc; }
    .p-vocal   { background: linear-gradient(135deg, #00f0ff, #0044ff); color: #ccffff; }
    .p-synth   { background: linear-gradient(135deg, #ffea00, #ff5500); color: #ffff99; }
    .p-kick    { background: linear-gradient(135deg, #ff0000, #880000); color: #ff9999; }

    .control-panel {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .eclipse-btn {
      flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 11px; cursor: pointer;
      background: linear-gradient(45deg, #ff0055, #7700ff); color: #fff; box-shadow: 0 0 20px rgba(255,0,85,0.5);
    }
    .eclipse-btn.active {
      background: linear-gradient(45deg, #00ffcc, #0088ff); color: #000;
    }

    .status-bar-dj {
      background: #141620; padding: 6px; border-radius: 8px; text-align: center; font-size: 10px; color: #ff0055; border: 1px solid #222; font-weight: bold;
    }

    .home-bar-area { height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="phone-screen">
      
      <div class="app-window">
        <div class="app-header">
          <span class="app-title">🌑 MONTAGEM ECLIPSE (ORIGINAL)</span>
          <span style="font-size: 10px; color: #00ffcc;" id="eclipseBadge">● READY</span>
        </div>

        <div class="control-panel">
          <button class="eclipse-btn" id="eclipseToggleBtn" onclick="toggleRealSong()">▶ تشغيل الأغنية الأصلية (Montagem Eclipse)</button>
        </div>

        <!-- أزرار الاستوديو التفاعلية -->
        <div class="pad-grid">
          <button class="pad-btn p-cowbell" id="btn-c1" onclick="hitPad('btn-c1', 'BELL HIGH')">🔔 <span>BELL HIGH</span></button>
          <button class="pad-btn p-cowbell" id="btn-c2" onclick="hitPad('btn-c2', 'BELL LOW')">🔔 <span>BELL LOW</span></button>
          <button class="pad-btn p-808"     id="btn-808" onclick="hitPad('btn-808', '808 SLIDE')">🎸 <span>808 SLIDE</span></button>
          
          <button class="pad-btn p-bass"    id="btn-sub" onclick="hitPad('btn-sub', 'SUB BASS')">🔊 <span>SUB BASS</span></button>
          <button class="pad-btn p-synth"   id="btn-lead" onclick="hitPad('btn-lead', 'LEAD SYNTH')">🎹 <span>LEAD SYNTH</span></button>
          <button class="pad-btn p-kick"    id="btn-kick" onclick="hitPad('btn-kick', 'HEAVY KICK')">🥁 <span>HEAVY KICK</span></button>
          
          <button class="pad-btn p-vocal"   id="btn-hey" onclick="hitPad('btn-hey', 'HEY! CHOP')">🎤 <span>HEY! CHOP</span></button>
          <button class="pad-btn p-808"     id="btn-rush" onclick="hitPad('btn-rush', 'RUSH BELL')">⚡ <span>RUSH BELL</span></button>
          <button class="pad-btn p-synth"   id="btn-fx" onclick="hitPad('btn-fx', 'CREEP FX')">🌀 <span>CREEP FX</span></button>
          
          <button class="pad-btn p-bass"    id="btn-dist" onclick="hitPad('btn-dist', 'DIST BASS')">🔥 <span>DIST BASS</span></button>
          <button class="pad-btn p-kick"    id="btn-snare" onclick="hitPad('btn-snare', 'SNARE')">💥 <span>SNARE</span></button>
          <button class="pad-btn p-cowbell" id="btn-drop" onclick="hitPad('btn-drop', 'DROP BELL')">🔥 <span>DROP BELL</span></button>
        </div>

        <div class="status-bar-dj" id="djStatus">اضغط زر التشغيل لسماع الأغنية الأصلية والتفاعل معها! 🎶</div>
      </div>

    </div>

    <div class="home-bar-area">
      <div class="home-bar"></div>
    </div>
  </div>

  <!-- ملف الأغنية الحقيقي الصافي -->
  <audio id="realSong" loop preload="auto">
    <source src="https://cdns-preview-d.dzcdn.net/stream/c-deda7b8e5c3b9b47833a6f958f258a74-3.mp3" type="audio/mp3">
  </audio>

  <script>
    let song = document.getElementById('realSong');
    let isPlaying = false;

    function toggleRealSong() {
      let btn = document.getElementById('eclipseToggleBtn');
      let badge = document.getElementById('eclipseBadge');

      if (!isPlaying) {
        song.play().then(() => {
          isPlaying = true;
          btn.classList.add('active');
          btn.innerText = "⏹ إيقاف الأغنية الأصلية";
          badge.innerText = "● PLAYING";
          document.getElementById('djStatus').innerText = "🔥 تعمل الآن: Montagem Eclipse الأصلية الحقيقية!";
        }).catch(err => {
          alert("الرجاء النقر مرة أخرى لسماع الصوت!");
        });
      } else {
        song.pause();
        isPlaying = false;
        btn.classList.remove('active');
        btn.innerText = "▶ تشغيل الأغنية الأصلية (Montagem Eclipse)";
        badge.innerText = "● READY";
        document.getElementById('djStatus').innerText = "تم إيقاف الأغنية.";
      }
    }

    function hitPad(id, name) {
      let el = document.getElementById(id);
      if(el) {
        el.classList.add('active-glow');
        setTimeout(() => el.classList.remove('active-glow'), 120);
      }
      document.getElementById('djStatus').innerText = `⚡ تفاعل دي جي: [ ${name} ] مع الأغنية!`;
    }
  </script>
</body>
</html>
