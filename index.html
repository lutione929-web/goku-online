<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Phone OS - Donkey & Fart Madness</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.4); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: linear-gradient(135deg, #1a0b2e, #090a15);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    /* 1. شاشة تسجيل الدخول بالاسم */
    #loginScreen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #090a15; z-index: 100; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    .login-input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #ff4757; background: #111; color: #fff; font-size: 13px; text-align: center; outline: none; }
    .login-btn { width: 100%; padding: 12px; background: #ff4757; color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,71,87,0.4); }

    /* الشاشة الرئيسية بعد تسجيل الدخول */
    .home-screen {
      flex: 1; padding: 25px 15px; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }

    /* الزر الأحمر العملاق والمرعب والمضحك */
    .giant-red-btn {
      width: 180px; height: 180px; background: radial-gradient(circle, #ff4757, #c0392b);
      border: 6px solid #fff; border-radius: 50%; color: #fff; font-size: 18px; font-weight: bold;
      cursor: pointer; box-shadow: 0 0 30px rgba(255,0,0,0.8); animation: pulseBtn 1.5s infinite;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    }
    .giant-red-btn:active { transform: scale(0.92); }

    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,0,0.6); }
      50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(255,0,0,1); }
      100% { transform: scale(1); box-shadow: 0 0 20px rgba(255,0,0,0.6); }
    }

    .home-bar-area {
      height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); cursor: pointer;
    }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول بالاسم -->
  <div id="loginScreen">
    <div style="font-size: 50px; margin-bottom: 10px;">🐴💨</div>
    <h2 style="color: #ff4757; font-size: 18px; margin-bottom: 5px;">مرحباً بك في النظام الخارق</h2>
    <p style="color: #aaa; font-size: 11px; margin-bottom: 15px;">الرجاء إدخال اسمك للبدء:</p>
    <input type="text" id="userNameInput" placeholder="اكتب اسمك هنا يا أسطورة..." class="login-input">
    <button class="login-btn" onclick="completeLogin()">دخول إلى النظام 🚀</button>
  </div>

  <div class="phone-body">
    <div class="phone-screen">
      
      <!-- الشاشة الرئيسية وتحتوي على الزر الأحمر العملاق -->
      <div class="home-screen" id="homeScreen">
        <h3 id="welcomeUserTitle" style="color: #f1c40f; margin-bottom: 25px; font-size: 15px;">أهلاً بك!</h3>
        
        <!-- الزر الأحمر العملاق -->
        <button class="giant-red-btn" onclick="triggerMadness()">
          <span>🚨</span>
          <span>اضغط هنا</span>
          <span style="font-size: 10px; font-weight: normal;">(حمير + Farts)</span>
        </button>

        <p id="funStatusText" style="color: #aaa; font-size: 11px; margin-top: 25px; line-height: 1.4;">اضغط الزر الأحمر لتفجير أصوات الحمير والضحك العشوائي! 😂</p>
      </div>

    </div>

    <div class="home-bar-area">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    let playerName = "أسطورة";

    function completeLogin() {
      let inputVal = document.getElementById('userNameInput').value.trim();
      if(inputVal) {
        playerName = inputVal;
      }
      document.getElementById('welcomeUserTitleinnerText = `أهلاً بك يا ${playerName} في عالم الفوضى! 🐴`;
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'flex';
    }

    // محرك توليد أصوات الحمير والـ Farts بالذكاء الصوتي (Web Audio API) بدون روابط خارجية
    let audioCtx = null;

    function triggerMadness() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();

      let effects = [playDonkeySound, playFartSound, playCrazySqueak];
      let randomEffect = effects[Math.floor(Math.random() * effects.length)];
      randomEffect();

      let messages = [
        `😂 يا ${playerName}، الحمار أطلق صوتاً مرعباً!`,
        `💨 أوووف! تم إطلاق Fart خرافي وعشوائي بنجاح!`,
        `🐴 حمار هائج يركض في الشاشة الآن!`,
        `💀 وااااو! ريحته وصلت لعندي يا ${playerName}!`
      ];
      document.getElementById('funStatusText').innerText = messages[Math.floor(Math.random() * messages.length)];
    }

    // صوت حمار كوميدي (ترددات متعرجة)
    function playDonkeySound() {
      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(300, now + 0.2);
      osc.frequency.linearRampToValueAtTime(120, now + 0.5);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.6);
    }

    // صوت Fart كوميدي ومضحك
    function playFartSound() {
      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(60, now);
      osc.frequency.linearRampToValueAtTime(40, now + 0.1);
      osc.frequency.linearRampToValueAtTime(90, now + 0.2);
      osc.frequency.linearRampToValueAtTime(50, now + 0.35);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.35);
    }

    // صوت صرير مجنون وعشوائي
    function playCrazySqueak() {
      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + 0.25);
    }
  </script>
</body>
</html>
