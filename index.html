<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AURA RNG - Mobile Ultra Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background-color: #070913; color: #ffffff; overflow: hidden; }

    /* حاوية اللعبة المرنة لملء شاشة الجوال بالكامل */
    .app-container {
      width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #0f1429 0%, #060810 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden;
    }

    /* الشريط العلوي */
    .top-bar {
      height: 56px; background: rgba(13, 17, 34, 0.95);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; border-bottom: 1px solid #1a233d; z-index: 10; shrink: 0;
    }

    .brand { font-weight: 800; font-size: 13px; letter-spacing: 0.5px; color: #38ef7d; }
    .brand span { color: #00c6ff; }

    .stats-group { display: flex; gap: 6px; }
    .stat-badge {
      background: #111728; border: 1px solid #1f2b48; padding: 4px 8px; border-radius: 8px;
      display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #c0cdf0;
    }
    .stat-badge .val { color: #ffffff; font-weight: 700; }

    /* منطقة العرض الرئيسية (تتأقلم تلقائياً مع حجم الشاشة) */
    .display-area {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; padding: 10px; width: 100%;
    }

    .equipped-pill {
      background: rgba(18, 25, 45, 0.8); border: 1px solid #28375c; padding: 4px 14px;
      border-radius: 20px; font-size: 11px; color: #8fa0cc; margin-bottom: 12px; z-index: 2;
    }
    .equipped-pill span { color: #38ef7d; font-weight: bold; }

    /* بطاقة الهالة */
    .aura-card {
      width: 90%; max-width: 360px; height: 50vh; max-height: 240px;
      background: rgba(15, 22, 41, 0.7); border: 2px solid #233257; border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; overflow: hidden; box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .aura-orb {
      width: 75px; height: 75px; border-radius: 50%; background: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); margin-bottom: 15px;
      transition: transform 0.3s, background 0.3s, box-shadow 0.3s;
    }
