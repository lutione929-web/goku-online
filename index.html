<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Epic Phone OS - Online Punch Arena</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; user-select: none; }
    body { background: #05050a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    .phone-body {
      width: 320px; height: 620px; background: #111; border-radius: 35px; border: 4px solid #333;
      box-shadow: 0 0 35px rgba(255, 0, 0, 0.4); position: relative; display: flex; flex-direction: column; overflow: hidden;
    }

    .phone-screen {
      flex: 1; background: linear-gradient(135deg, #2b0b0b, #090a15);
      position: relative; overflow: hidden; display: flex; flex-direction: column;
    }

    .app-window {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; display: flex; flex-direction: column; z-index: 50; color: #fff; padding: 15px;
    }

    .header { font-size: 14px; font-weight: bold; color: #ff4757; margin-bottom: 15px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; }
    
    /* شاشة إدخال الكود والغرفة */
    .lobby-box { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; text-align: center; }
    .input-box { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ff4757; background: #1a0505; color: #fff; font-size: 12px; text-align: center; outline: none; }
    .action-btn { width: 100%; padding: 10px; background: #ff4757; color: #fff; border: none; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,71,87,0.4); }

    /* حلبة القتال */
    .arena-box { flex: 1; display: none; flex-direction: column; justify-content: space-between; padding: 10px 0; }
    .fighter-card { background: #1a0505; border: 1px solid #ff4757; border-radius: 10px; padding: 10px; text-align: center; }
    .hp-bar-bg { width: 100%; height: 10px; background: #333; border-radius: 5px; overflow: hidden; margin-top: 5px; }
    .hp-bar-fill { width: 100%; height: 100%; background: #00ba7c; transition: width 0.3s; }

    .ring-arena { text-align: center; font-size: 50px; margin: 10px 0; animation: shakeRing 0.2s infinite alternate; }
    @keyframes shakeRing { 0% { transform: translateX(-2px); } 100% { transform: translateX(2px); } }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .punch-btn { background: #c0392b; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 12px; cursor: pointer; }
    .punch-btn:active { transform: scale(0.95); background: #e74c3c; }

    .home-bar-area { height: 20px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.2); }
    .home-bar { width: 100px; height: 4px; background: #fff; border-radius: 2px; opacity: 0.7; }
  </style>
</head>
<body>

  <div class="phone-body">
    <div class="phone-screen">
      
      <div class="app-window">
        <div class="header">🥊 حلبة الضرب الأونلاين (Online Punch)</div>

        <!-- 1. غرف اللعب وإدخال الكود -->
        <div class="lobby-box" id="lobbyScreen">
          <p style="font-size: 11px; color: #aaa;">أنشئ غرفة أو اكتب كود صديقك لتدخلوا نفس الجيم تماماً!</p>
          <input type="text" id="roomCodeInput" placeholder="اكتب كود الغرفة (مثال: 777)..." class="input-box">
          <button class="action-btn" onclick="joinRoom()">دخول الغرفة / بدء القتال 🚀</button>
        </div>

        <!-- 2. شاشة القتال الفعلي -->
        <div class="arena-box" id="arenaScreen" style="display: none;">
          <div class="fighter-card">
            <span id="enemyName" style="font-size: 11px; color: #ff6b6b;">الخصم في الغرفة</span>
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="enemyHp" style="width: 100%;"></div></div>
          </div>

          <div class="ring-arena" id="ringAvatar">🥊💥</div>

          <div class="fighter-card" style="border-color: #00ba7c; background: #021a10;">
            <span style="font-size: 11px; color: #00ba7c;">أنت (البطل)</span>
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="myHp" style="width: 100%;"></div></div>
          </div>

          <div class="controls-grid">
            <button class="punch-btn" onclick="hitOpponent(15)">⚡ لكمة سريعة</button>
            <button class="punch-btn" style="background: #d35400;" onclick="hitOpponent(30)">🔥 ضربة قاضية</button>
          </div>
        </div>

      </div>

    </div>

    <div class="home-bar-area">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    let currentRoom = "";
    let myHpVal = 100;
    let enemyHpVal = 100;

    function joinRoom() {
      let code = document.getElementById('roomCodeInput').value.trim();
      if(!code) {
        alert("الرجاء إدخال كود الغرفة أولاً!");
        return;
      }
      currentRoom = code;
      document.getElementById('lobbyScreen').style.display = 'none';
      document.getElementById('arenaScreen').style.display = 'flex';
      document.getElementById('enemyName').innerText = `الغرفة رقم: #${code} (متصل)`;
    }

    function hitOpponent(damage) {
      if(enemyHpVal <= 0 || myHpVal <= 0) return;

      // تقليل طاقة الخصم
      enemyHpVal -= damage;
      if(enemyHpVal < 0) enemyHpVal = 0;
      document.getElementById('enemyHp').style.width = enemyHpVal + "%";
      document.getElementById('ringAvatar').innerHTML = "💥👊";

      setTimeout(() => {
        document.getElementById('ringAvatar').innerHTML = "🥊💥";
      }, 300);

      if(enemyHpVal === 0) {
        alert("🎉 فزت بالمباراة يا أسطورة وأبرحت الخصم ضرباً!");
        resetGame();
        return;
      }

      // ردة فعل الخصم الهجومية بعد ثانية
      setTimeout(() => {
        let counterDamage = Math.floor(Math.random() * 15) + 5;
        myHpVal -= counterDamage;
        if(myHpVal < 0) myHpVal = 0;
        document.getElementById('myHp').style.width = myHpVal + "%";

        if(myHpVal === 0) {
          alert("💀 للأسف خسرت المعركة! الخصم كان أقوى.");
          resetGame();
        }
      }, 800);
    }

    function resetGame() {
      myHpVal = 100;
      enemyHpVal = 100;
      document.getElementById('myHp').style.width = "100%";
      document.getElementById('enemyHp').style.width = "100%";
      document.getElementById('arenaScreen').style.display = 'none';
      document.getElementById('lobbyScreen').style.display = 'flex';
    }
  </script>
</body>
</html>
