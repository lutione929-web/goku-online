<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Goku Fighter 2 — Saga</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#02040a;color:#e8f0ff;font-family:Tahoma,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
.logo{margin:10px 0 4px;font-size:1.35rem;letter-spacing:1px;
background:linear-gradient(90deg,#5dade2,#aed6f1,#f4d03f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:bold}
.tag{font-size:.8rem;opacity:.65;margin-bottom:8px}
#stage{position:relative;width:min(920px,100%);border:2px solid #1abc9c;border-radius:12px;overflow:hidden;
box-shadow:0 0 40px rgba(26,188,156,.25),inset 0 0 60px rgba(0,0,0,.4)}
canvas{display:block;width:100%;height:auto;background:#0b1020}
#ui{display:none;width:min(920px,100%);padding:8px;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{background:rgba(15,30,50,.9);border:1px solid #1abc9c55;border-radius:12px;padding:6px 12px;font-size:.85rem}
.barw{width:100px;height:8px;background:#1a2338;border-radius:4px;margin-top:3px;overflow:hidden}
.barw>i{display:block;height:100%;border-radius:4px}
#hp{background:linear-gradient(90deg,#e74c3c,#c0392b)}
#ki{background:linear-gradient(90deg,#3498db,#2980b9)}
#combo{background:linear-gradient(90deg,#f39c12,#e67e22)}
.controls{display:none;width:min(920px,100%);padding:6px;gap:6px;flex-wrap:wrap;justify-content:center}
.controls button{border:none;border-radius:18px;padding:10px 14px;font-size:.85rem;color:#fff;font-family:inherit;cursor:pointer}
.controls button:disabled{opacity:.35}
#bPunch{background:#c0392b}#bDash{background:#16a085}#bKame{background:#2980b9}
#bForm{background:#8e44ad}#bMenu{background:#2c3e50}
/* MENU */
#menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:radial-gradient(circle at 50% 30%,#0e2a3a 0%,#050810 70%);text-align:center;padding:20px}
#menu h1{font-size:1.7rem;margin-bottom:4px;color:#1abc9c;text-shadow:0 0 20px #1abc9c66}
#menu .s{opacity:.7;margin-bottom:18px;font-size:.9rem;line-height:1.5}
.mbtn{width:min(240px,90%);padding:13px;margin:5px;border:none;border-radius:28px;font-size:1rem;color:#fff;font-family:inherit;cursor:pointer}
.mbtn.go{background:linear-gradient(90deg,#1abc9c,#16a085)}
.mbtn.alt{background:linear-gradient(90deg,#2980b9,#6c5ce7)}
.mbtn.dim{background:#2c3e50}
#toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:25;font-size:1.25rem;font-weight:bold;
text-align:center;text-shadow:0 0 16px #000;display:none;white-space:pre-line;pointer-events:none}
.help{display:none;font-size:.75rem;opacity:.6;text-align:center;max-width:560px;margin:8px;line-height:1.4}
</style>
</head>
<body>
<div class="logo">GOKU FIGHTER 2 — SAGA</div>
<div class="tag">جزء جديد: داش · كومبو · زعماء · تحول SSB</div>

<div id="stage">
  <canvas id="cv" width="900" height="500"></canvas>
  <div id="toast"></div>
  <div id="menu">
    <h1>Goku Fighter 2</h1>
    <div class="s">نظام كومبو · اندفاع سريع · معارك زعماء<br>مختلف تماماً عن الجزء الأول</div>
    <button class="mbtn go" onclick="start()">▶ ابدأ الساجا</button>
    <button class="mbtn alt" onclick="toast('الجزء 2:\n• داش (اندفاع)\n• عداد كومبو\n• زعيم كل 5 موجات\n• تحول SSB',2800)">ما الجديد؟</button>
    <button class="mbtn dim" onclick="toast('صُنعت للرفع على GitHub\nافتح index.html أو GitHub Pages',2200)">عن اللعبة</button>
    <p style="margin-top:16px;opacity:.65;font-size:.85rem">أفضل نتيجة: <b id="bestV">0</b></p>
  </div>
</div>

<div id="ui">
  <div class="chip">❤️ HP<div class="barw"><i id="hp" style="width:100%"></i></div></div>
  <div class="chip">🔵 Ki<div class="barw"><i id="ki" style="width:100%"></i></div></div>
  <div class="chip">🔥 كومبو<div class="barw"><i id="combo" style="width:0%"></i></div></div>
  <div class="chip">الموجة <b id="wv">1</b></div>
  <div class="chip">النقاط <b id="sc">0</b></div>
  <div class="chip" id="formL">Base</div>
</div>
<div class="controls" id="ctrls">
  <button id="bPunch" onclick="punch()">👊 ضربة</button>
  <button id="bDash" onclick="dash()">⚡ داش</button>
  <button id="bKame" onclick="kame()">💥 Kamehameha</button>
  <button id="bForm" onclick="transform()">🔥 تحول</button>
  <button id="bMenu" onclick="menu()">قائمة</button>
</div>
<p class="help" id="help">WASD/أسهم حركة · مسافة ضربة · Shift داش · Q كامهـامهـا · E تحول<br>كل 5 موجات يظهر زعيم أقوى</p>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let actx=null;
function A(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext);if(actx.state==='suspended')actx.resume()}
function beep(f,d,t='square',v=.12,s=0){
  A();const o=actx.createOscillator(),g=actx.createGain();
  o.type=t;o.frequency.setValueAtTime(f,actx.currentTime);
  if(s)o.frequency.linearRampToValueAtTime(f+s,actx.currentTime+d);
  g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);
  o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d);
}

const FORMS=[
  {id:'base',name:'Base',pow:1,spd:4.2,hp:100,ki:100,col:'#e67e22',hair:'#1a1a2e'},
  {id:'ssj',name:'SSJ',pow:2.2,spd:5.0,hp:140,ki:130,col:'#f1c40f',hair:'#f4d03f'},
  {id:'ssb',name:'SSB',pow:3.8,spd:6.2,hp:190,ki:180,col:'#3498db',hair:'#5dade2'},
  {id:'ui',name:'Ultra Instinct',pow:5.5,spd:7.2,hp:240,ki:220,col:'#ecf0f1',hair:'#bdc3c7'}
];

let best=+localStorage.getItem('gf2saga')||0;
document.getElementById('bestV').textContent=best;

let on=false,score=0,wave=1,fi=0; // form index
let P,ens=[],beams=[],fx=[];
let keys={},pCD=0,dCD=0,kCD=0,inv=0,combo=0,comboT=0;
let charging=false,chargeT=0,boss=false;

function toast(t,ms=1400){
  const el=document.getElementById('toast');
  el.textContent=t;el.style.display='block';
  clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',ms);
}
function hud(){
  if(!P)return;
  const f=FORMS[fi];
  document.getElementById('hp').style.width=Math.max(0,P.hp/f.hp*100)+'%';
  document.getElementById('ki').style.width=Math.max(0,P.ki/f.ki*100)+'%';
  document.getElementById('combo').style.width=Math.min(100,combo*10)+'%';
  document.getElementById('wv').textContent=wave+(boss?' 👑':'');
  document.getElementById('sc').textContent=score;
  document.getElementById('formL').textContent=f.name;
  document.getElementById('bPunch').disabled=!on||pCD>0;
  document.getElementById('bDash').disabled=!on||dCD>0||P.ki<12;
  document.getElementById('bKame').disabled=!on||kCD>0||charging||P.ki<28;
  document.getElementById('bForm').disabled=!on||fi>=FORMS.length-1||P.ki<40;
}

function menu(){
  on=false;
  document.getElementById('menu').style.display='flex';
  document.getElementById('ui').style.display='none';
  document.getElementById('ctrls').style.display='none';
  document.getElementById('help').style.display='none';
  document.getElementById('bestV').textContent=best;
}
function start(){
  A();
  document.getElementById('menu').style.display='none';
  document.getElementById('ui').style.display='flex';
  document.getElementById('ctrls').style.display='flex';
  document.getElementById('help').style.display='block';
  on=true;score=0;wave=1;fi=0;boss=false;combo=0;
  const f=FORMS[0];
  P={x:160,y:320,r:28,hp:f.hp,ki:f.ki,face:1,anim:0,dash:0};
  ens=[];beams=[];fx=[];pCD=dCD=kCD=inv=0;charging=false;
  toast('الساجا تبدأ!',900);
  spawnWave();
  requestAnimationFrame(loop);
}

function spawnWave(){
  ens=[];
  boss=(wave%5===0);
  if(boss){
    ens.push({x:cv.width+60,y:260,r:36,hp:180+wave*40,max:180+wave*40,sp:1.15,dmg:18+wave,pts:300+wave*20,col:'#e74c3c',name:'BOSS W'+wave,flash:0,atk:0,isBoss:true});
    toast('👑 زعيم الموجة '+wave+'!',1600);beep(120,.3,'sawtooth',.15,80);
    return;
  }
  const n=2+Math.floor(wave*0.9);
  for(let i=0;i<n;i++){
    const types=[
      {r:16,hp:30,sp:1.05,dmg:7,pts:15,col:'#27ae60',name:'Saibaman'},
      {r:22,hp:70,sp:1.2,dmg:11,pts:40,col:'#2980b9',name:'Soldier'},
      {r:24,hp:100,sp:1.1,dmg:14,pts:65,col:'#8e44ad',name:'Elite'}
    ];
    let t=types[0];
    if(wave>=3)t=types[Math.random()<.5?1:0];
    if(wave>=6)t=types[Math.floor(Math.random()*3)];
    setTimeout(()=>{
      if(!on)return;
      ens.push({x:cv.width+30+Math.random()*80,y:140+Math.random()*240,...t,max:t.hp,flash:0,atk:0,isBoss:false});
    },i*320);
  }
}

window.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();
  if(!on)return;
  if(e.key===' ')punch();
  if(e.key==='Shift'||e.key.toLowerCase()==='shift')dash();
  if(e.key.toLowerCase()==='q')kame();
  if(e.key.toLowerCase()==='e')transform();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

let touch=null;
cv.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();
  touch={x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0],r=cv.getBoundingClientRect();
  touch={x:(t.clientX-r.left)*(cv.width/r.width),y:(t.clientY-r.top)*(cv.height/r.height)}},{passive:false});
cv.addEventListener('touchend',()=>touch=null);

function punch(){
  if(!on||pCD>0)return;A();
  const f=FORMS[fi];pCD=fi>=3?12:fi>=2?15:18;
  beep(160,.07,'square',.16,-60);P.anim=6;
  const range=52+fi*8;let hit=false;
  for(const e of ens){
    const dx=e.x-P.x,dy=e.y-P.y;
    if(Math.hypot(dx,dy)<range+e.r && Math.sign(dx||1)===P.face){
      const dmg=(10+combo*2)*f.pow;
      e.hp-=dmg;e.flash=5;e.x+=P.face*16;hit=true;
      combo=Math.min(10,combo+1);comboT=90;
      spark(e.x,e.y,'#fff',5);
      if(e.hp<=0)die(e);
    }
  }
  if(hit)beep(90,.09,'sawtooth',.12,-40);
}
function dash(){
  if(!on||dCD>0||P.ki<12)return;A();
  P.ki-=12;dCD=40;P.dash=12;
  P.x+=P.face*90;
  P.x=Math.max(30,Math.min(cv.width-30,P.x));
  inv=15;beep(300,.12,'sine',.12,200);
  spark(P.x,P.y,'#1abc9c',10);
  toast('⚡ داش!',400);
}
function kame(){
  if(!on||kCD>0||charging||P.ki<28)return;A();
  charging=true;chargeT=0;beep(150,.4,'sawtooth',.1,300);toast('Ka...me...',500);
}
function fireKame(){
  const f=FORMS[fi];P.ki-=28;kCD=70;charging=false;
  beep(55,.65,'sawtooth',.2,-20);toast('HAAA!!',600);
  const col=fi>=3?'#ecf0f1':fi>=2?'#5dade2':fi>=1?'#f7dc6f':'#5dade2';
  beams.push({x:P.x+P.face*30,y:P.y,dir:P.face,life:48,max:48,w:22+fi*6,dmg:28*f.pow*(1+combo*0.08),col});
  spark(P.x+P.face*40,P.y,col,14);
}
function transform(){
  if(!on||fi>=FORMS.length-1||P.ki<40)return;A();
  P.ki-=40;fi++;
  const f=FORMS[fi];P.hp=Math.min(f.hp,P.hp+40);
  beep(250,.2,'sawtooth',.14,180);setTimeout(()=>beep(500,.25,'square',.12),180);
  toast('🔥 '+f.name+'!',1400);
  spark(P.x,P.y,f.hair,30);
  hud();
}
function die(e){
  const mult=1+combo*0.15;
  score+=Math.floor(e.pts*mult);
  spark(e.x,e.y,e.col,12);
  ens=ens.filter(x=>x!==e);
  if(!ens.length){
    beep(440,.08,'square',.1);setTimeout(()=>beep(660,.12,'square',.1),90);
    toast(boss?'👑 الزعيم هُزم!\nالموجة '+(wave+1):'الموجة '+wave+' انتهت!',1200);
    wave++;boss=false;
    setTimeout(()=>{if(on)spawnWave()},1400);
  }
}
function spark(x,y,c,n){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,life:14+Math.random()*12,c,s:2+Math.random()*3})}

function update(){
  if(pCD>0)pCD--;if(dCD>0)dCD--;if(kCD>0)kCD--;if(inv>0)inv--;
  if(comboT>0){comboT--;if(comboT<=0)combo=0}
  if(charging){chargeT++;if(chargeT>=30)fireKame()}
  if(P.dash>0)P.dash--;

  const f=FORMS[fi];
  let dx=0,dy=0;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(touch){const tx=touch.x-P.x,ty=touch.y-P.y,d=Math.hypot(tx,ty);if(d>14){dx=tx/d;dy=ty/d}}
  if(!charging&&(dx||dy)){
    const l=Math.hypot(dx,dy)||1;
    P.x+=(dx/l)*f.spd;P.y+=(dy/l)*f.spd;
    if(dx)P.face=Math.sign(dx);
  }
  P.x=Math.max(28,Math.min(cv.width-28,P.x));
  P.y=Math.max(55,Math.min(cv.height-60,P.y));
  P.ki=Math.min(f.ki,P.ki+0.1*(1+fi*0.15));

  for(const e of ens){
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    e.x+=(dx/d)*e.sp;e.y+=(dy/d)*e.sp;
    if(e.atk>0)e.atk--;
    if(d<e.r+P.r-4&&e.atk<=0&&inv<=0){
      const red=1-fi*0.12;
      P.hp-=e.dmg*Math.max(0.4,red);inv=18;e.atk=34;
      beep(170,.1,'sawtooth',.12,-90);spark(P.x,P.y,'#e74c3c',6);
      combo=0;comboT=0;
      if(P.hp<=0){over();return}
    }
  }
  for(const b of beams){
    b.life--;
    const len=Math.min(cv.width,70+(1-b.life/b.max)*900);
    for(const e of[...ens]){
      const end=b.x+b.dir*len,a=Math.min(b.x,end),z=Math.max(b.x,end);
      if(e.x>a-e.r&&e.x<z+e.r&&Math.abs(e.y-b.y)<b.w+e.r){
        e.hp-=b.dmg*0.04;e.flash=3;e.x+=b.dir*2;
        if(Math.random()<.3)spark(e.x,e.y,b.col,2);
        if(e.hp<=0)die(e);
      }
    }
  }
  beams=beams.filter(b=>b.life>0);
  for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life--}
  fx=fx.filter(p=>p.life>0);
  hud();
}
function over(){
  on=false;
  if(score>best){best=score;localStorage.setItem('gf2saga',best)}
  toast('انتهت الساجا\nالنقاط: '+score+'\nالموجة: '+wave,3200);
  setTimeout(menu,2800);
}

function draw(){
  // bg
  const g=ctx.createLinearGradient(0,0,0,cv.height);
  g.addColorStop(0,'#0a1628');g.addColorStop(.5,'#12243a');g.addColorStop(1,'#0d1520');
  ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height);
  // stars
  ctx.fillStyle='rgba(255,255,255,.15)';
  for(let i=0;i<40;i++){const sx=(i*97+Date.now()/80)%cv.width,sy=(i*53)%(cv.height-50);ctx.fillRect(sx,sy,2,2)}
  // ground
  ctx.fillStyle='#0a1520';ctx.fillRect(0,cv.height-48,cv.width,48);
  ctx.strokeStyle='#1abc9c33';ctx.beginPath();ctx.moveTo(0,cv.height-48);ctx.lineTo(cv.width,cv.height-48);ctx.stroke();

  // beams
  for(const b of beams){
    const len=Math.min(cv.width,70+(1-b.life/b.max)*900);
    const gr=ctx.createLinearGradient(b.x,b.y,b.x+b.dir*len,b.y);
    gr.addColorStop(0,b.col);gr.addColorStop(.45,'#fff');gr.addColorStop(1,b.col);
    ctx.globalAlpha=.9;ctx.fillStyle=gr;
    ctx.beginPath();ctx.ellipse(b.x+b.dir*len/2,b.y,len/2,b.w/2,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.25;ctx.beginPath();ctx.ellipse(b.x+b.dir*len/2,b.y,len/2,b.w,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  }
  // enemies
  for(const e of ens){
    if(e.flash>0){ctx.globalAlpha=.55;e.flash--}
    ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.col;ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();
    if(e.isBoss){ctx.strokeStyle='#f1c40f';ctx.lineWidth=3;ctx.stroke()}
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(e.x-5,e.y-3,3,0,Math.PI*2);ctx.arc(e.x+5,e.y-3,3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    const bw=e.r*2;ctx.fillStyle='#222';ctx.fillRect(e.x-bw/2,e.y-e.r-14,bw,5);
    ctx.fillStyle='#e74c3c';ctx.fillRect(e.x-bw/2,e.y-e.r-14,bw*(e.hp/e.max),5);
    ctx.fillStyle='#fff';ctx.font='bold 10px Tahoma';ctx.textAlign='center';ctx.fillText(e.name,e.x,e.y+e.r+12);
  }
  // player
  if(inv<=0||Math.floor(inv/3)%2===0){
    const f=FORMS[fi],x=P.x,y=P.y;
    // aura
    if(fi>0){
      const pulse=Math.sin(Date.now()/50)*6;
      ctx.beginPath();ctx.arc(x,y,42+pulse,0,Math.PI*2);
      ctx.fillStyle=fi>=3?'rgba(255,255,255,.2)':fi>=2?'rgba(52,152,219,.28)':'rgba(241,196,15,.28)';
      ctx.fill();
    }
    if(charging){ctx.beginPath();ctx.arc(x+P.face*28,y,10+chargeT,.8,0,Math.PI*2);ctx.fillStyle='rgba(100,180,255,.35)';ctx.fill()}
    if(P.dash>0){ctx.globalAlpha=.4;ctx.fillStyle='#1abc9c';ctx.fillRect(x-P.face*40,y-15,30,30);ctx.globalAlpha=1}
    ctx.save();if(P.face<0){ctx.translate(x,0);ctx.scale(-1,1);ctx.translate(-x,0)}
    // gi
    ctx.fillStyle=f.col;ctx.fillRect(x-13,y-4,26,20);
    ctx.fillStyle='#1a5276';ctx.fillRect(x-14,y+12,28,5);
    ctx.fillStyle='#f5cba7';ctx.beginPath();ctx.arc(x,y-16,12,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=f.hair;
    ctx.beginPath();ctx.moveTo(x-10,y-20);ctx.lineTo(x-6,y-38);ctx.lineTo(x,y-24);ctx.lineTo(x+4,y-40);ctx.lineTo(x+8,y-24);ctx.lineTo(x+11,y-34);ctx.lineTo(x+9,y-20);ctx.fill();
    ctx.fillStyle=fi>=2?'#5dade2':'#111';
    ctx.beginPath();ctx.arc(x-4,y-17,2.5,0,Math.PI*2);ctx.arc(x+4,y-17,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#1a5276';ctx.fillRect(x-12,y+20,10,8);ctx.fillRect(x+2,y+20,10,8);
    if(P.anim>0){ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x+34,y,10,0,Math.PI*2);ctx.stroke();P.anim--}
    ctx.restore();
    ctx.fillStyle='#fff';ctx.font='bold 11px Tahoma';ctx.textAlign='center';ctx.fillText('Goku',x,y+40);
    if(fi>0){ctx.fillStyle=f.hair;ctx.font='bold 10px Tahoma';ctx.fillText(f.name,x,y+52)}
  }
  for(const p of fx){ctx.globalAlpha=p.life/20;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()}
  ctx.globalAlpha=1;
}
function loop(){
  if(!on)return;
  update();draw();
  requestAnimationFrame(loop);
}
menu();
</script>
